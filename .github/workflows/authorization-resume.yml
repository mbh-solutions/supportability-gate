name: Resume Supportability Authorization

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  invalidate-authorization:
    name: Withhold authorization during reevaluation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: read
    outputs:
      gate-sha: ${{ steps.revision.outputs.sha }}
      continue: ${{ steps.invalidate.outputs.continue }}
    steps:
      - name: Resolve authenticated reusable workflow revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.referenced_workflows[] | select(.path | startswith("mbh-solutions/supportability-gate/.github/workflows/authorization-resume.yml@")) | .sha')
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out authenticated supervisor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mbh-solutions/supportability-gate
          ref: bdae8016893ed55ad301f389234480cd3d8a6868
          persist-credentials: false
          path: gate

      - name: Set up Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Keep authorization pending if continuation fails
        id: invalidate
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/gate/src:${{ github.workspace }}/gate/tests
          RESUME_WORKFLOW_SHA: ${{ steps.revision.outputs.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python -P gate/tests/hosted_authorization_resume.py invalidate

  evaluate-authorization:
    name: Evaluate authorization against retained evidence
    needs: invalidate-authorization
    if: needs.invalidate-authorization.outputs.continue != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      gate-sha: ${{ needs.invalidate-authorization.outputs.gate-sha }}
    steps:
      - name: Check out authenticated supervisor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mbh-solutions/supportability-gate
          ref: bdae8016893ed55ad301f389234480cd3d8a6868
          persist-credentials: false
          path: gate

      - name: Set up Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Select current authenticated capture
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/gate/src:${{ github.workspace }}/gate/tests
          RESUME_WORKFLOW_SHA: ${{ needs.invalidate-authorization.outputs.gate-sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python -P gate/tests/hosted_authorization_resume.py prepare --directory "$RUNNER_TEMP/resume"

      - name: Check out exact consumer for static analysis only
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.prepare.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
          path: target

      - name: Install locked static evaluator dependencies
        if: steps.prepare.outputs.ready == 'true'
        run: python -m pip install --disable-pip-version-check --require-hashes -r gate/requirements-dev.lock

      - name: Reevaluate owner authorization without running consumer code
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/gate/src:${{ github.workspace }}/gate/tests
          RESUME_WORKFLOW_SHA: ${{ needs.invalidate-authorization.outputs.gate-sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python -P gate/tests/hosted_authorization_resume.py evaluate --directory "$RUNNER_TEMP/resume" --target "$GITHUB_WORKSPACE/target"

      - name: Retain separate authorization decision and original capture identity
        id: upload
        if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: authorization-resume-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resume/evaluated
          if-no-files-found: error

  publish-authorization:
    name: Publish resumed authorization
    needs: evaluate-authorization
    if: needs.evaluate-authorization.outputs.artifact-id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out exact supervisor without consumer code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mbh-solutions/supportability-gate
          ref: bdae8016893ed55ad301f389234480cd3d8a6868
          persist-credentials: false
          path: gate

      - name: Set up Python 3.12.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Download exact decision from the read-only evaluator
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.evaluate-authorization.outputs.artifact-id }}
          path: ${{ runner.temp }}/decision

      - name: Recheck freshness and update original required checks
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/gate/src:${{ github.workspace }}/gate/tests
          RESUME_WORKFLOW_SHA: ${{ needs.evaluate-authorization.outputs.gate-sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python -P gate/tests/hosted_authorization_resume.py publish --directory "$RUNNER_TEMP/decision"
