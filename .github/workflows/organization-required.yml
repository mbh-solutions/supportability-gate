name: Organization Required Supportability Gate

on:
  pull_request:

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  observe-codex-review:
    name: Observe Codex Review
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out exact gate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mbh-solutions/supportability-gate
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: gate

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Observe serial focused connector reviews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          PYTHONPATH: ${{ github.workspace }}/gate/src
        run: |
          python -P -c 'import os; from supportability_gate.codex_review import FOCUSED_OBSERVER_MARKER, FOCUSES, require_focused_acknowledgements; comment_ids = require_focused_acknowledgements(os.environ["GITHUB_REPOSITORY"], int(os.environ["PULL_NUMBER"]), os.environ["HEAD_SHA"], int(os.environ["GITHUB_RUN_ID"]), os.environ["GITHUB_TOKEN"]); print("\n".join(f"{FOCUSED_OBSERVER_MARKER}{focus}:{comment_id}" for focus, comment_id in zip(FOCUSES, comment_ids, strict=True)))'

  collect-codex-review:
    name: Collect Codex Review
    needs: observe-codex-review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact gate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mbh-solutions/supportability-gate
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: gate

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect one-time focused connector completions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          PYTHONPATH: ${{ github.workspace }}/gate/src
        run: |
          python -P -c 'import os; from supportability_gate.codex_review import FOCUSED_COMPLETION_MARKER, require_focused_completion; evidence = require_focused_completion(os.environ["GITHUB_REPOSITORY"], int(os.environ["PULL_NUMBER"]), os.environ["HEAD_SHA"], int(os.environ["GITHUB_RUN_ID"]), os.environ["GITHUB_TOKEN"]); print("\n".join(f"{FOCUSED_COMPLETION_MARKER}{item.focus}:{item.request_id}:{item.completion.kind}:{item.completion.artifact_id}" for item in evidence))'

  characterize-base:
    name: Characterize Base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      capture-sha256: ${{ steps.capture.outputs.sha256 }}
    steps:
      - name: Check out characterization definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: definition

      - name: Check out exact target base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: target

      - name: Check out exact gate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mbh-solutions/supportability-gate
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: gate

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact characterization dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r gate/requirements-dev.lock

      - name: Capture exact base behavior twice
        id: capture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: ${{ github.workspace }}/gate/src
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python -P "$GITHUB_WORKSPACE/gate/tests/hosted_characterization.py" \
            --target-repository "$GITHUB_WORKSPACE/target" \
            --definition-repository "$GITHUB_WORKSPACE/definition" \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --side base \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job characterize-base \
            --output "$RUNNER_TEMP/base/characterization.json"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/base/characterization.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload authenticated base behavior
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: characterization-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/base/characterization.json
          if-no-files-found: error

  characterize-head:
    name: Characterize Head
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      capture-sha256: ${{ steps.capture.outputs.sha256 }}
    steps:
      - name: Check out characterization definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: definition

      - name: Check out exact target head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: target

      - name: Check out exact gate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mbh-solutions/supportability-gate
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: gate

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact characterization dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r gate/requirements-dev.lock

      - name: Capture exact head behavior twice
        id: capture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: ${{ github.workspace }}/gate/src
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python -P "$GITHUB_WORKSPACE/gate/tests/hosted_characterization.py" \
            --target-repository "$GITHUB_WORKSPACE/target" \
            --definition-repository "$GITHUB_WORKSPACE/definition" \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --side head \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --job characterize-head \
            --output "$RUNNER_TEMP/head/characterization.json"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/head/characterization.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload authenticated head behavior
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: characterization-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/head/characterization.json
          if-no-files-found: error

  quality-profile:
    name: Quality Profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      capture-sha256: ${{ steps.capture.outputs.sha256 }}
    steps:
      - name: Check out exact target head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: target

      - name: Check out exact gate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mbh-solutions/supportability-gate
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: gate

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install exact quality runner dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r gate/requirements-dev.lock

      - name: Capture fixed stack-native quality profile
        id: capture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: ${{ github.workspace }}/gate/src
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set +e
          python -P "$GITHUB_WORKSPACE/gate/tests/hosted_quality_profile.py" \
            --repository "$GITHUB_WORKSPACE/target" \
            --repository-name "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/quality/quality-gates.json"
          echo "status=$?" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/quality/quality-gates.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload authenticated quality evidence
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality/quality-gates.json
          if-no-files-found: error

  deterministic-evidence:
    name: Deterministic Supportability Evidence
    needs: [characterize-base, characterize-head, quality-profile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out target pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: target

      - name: Check out exact gate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mbh-solutions/supportability-gate
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: gate

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install exact gate
        id: install
        continue-on-error: true
        run: |
          python -m venv "$RUNNER_TEMP/gate-venv"
          "$RUNNER_TEMP/gate-venv/bin/python" -m pip install --disable-pip-version-check --require-hashes -r gate/requirements-dev.lock
          "$RUNNER_TEMP/gate-venv/bin/python" -m pip install --disable-pip-version-check --no-build-isolation --no-deps ./gate

      - name: Download authenticated base behavior
        id: download_base
        if: needs.characterize-base.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.characterize-base.outputs.artifact-id }}
          path: ${{ runner.temp }}/base

      - name: Download authenticated head behavior
        id: download_head
        if: needs.characterize-head.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.characterize-head.outputs.artifact-id }}
          path: ${{ runner.temp }}/head

      - name: Download authenticated quality evidence
        id: download_quality
        if: needs.quality-profile.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.quality-profile.outputs.artifact-id }}
          path: ${{ runner.temp }}/quality

      - name: Read back GitHub artifact metadata
        id: artifact_metadata
        if: steps.download_quality.outcome == 'success'
        continue-on-error: true
        env:
          ARTIFACT_ID: ${{ needs.quality-profile.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
            --output "$RUNNER_TEMP/quality/artifact-metadata.json"

      - name: Verify exact behavior and refactor policy
        id: refactor_policy
        if: >-
          steps.install.outcome == 'success' &&
          steps.download_base.outcome == 'success' &&
          steps.download_head.outcome == 'success'
        continue-on-error: true
        env:
          BASE_ARTIFACT_DIGEST: ${{ needs.characterize-base.outputs.artifact-digest }}
          BASE_ARTIFACT_ID: ${{ needs.characterize-base.outputs.artifact-id }}
          BASE_CAPTURE_SHA256: ${{ needs.characterize-base.outputs.capture-sha256 }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_ARTIFACT_DIGEST: ${{ needs.characterize-head.outputs.artifact-digest }}
          HEAD_ARTIFACT_ID: ${{ needs.characterize-head.outputs.artifact-id }}
          HEAD_CAPTURE_SHA256: ${{ needs.characterize-head.outputs.capture-sha256 }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          "$RUNNER_TEMP/gate-venv/bin/python" -P -m supportability_gate.characterization verify \
            --repository "$GITHUB_WORKSPACE/target" \
            --repository-name "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --base-evidence "$RUNNER_TEMP/base/characterization.json" \
            --head-evidence "$RUNNER_TEMP/head/characterization.json" \
            --base-artifact-id "$BASE_ARTIFACT_ID" \
            --base-artifact-digest "$BASE_ARTIFACT_DIGEST" \
            --base-capture-sha256 "$BASE_CAPTURE_SHA256" \
            --head-artifact-id "$HEAD_ARTIFACT_ID" \
            --head-artifact-digest "$HEAD_ARTIFACT_DIGEST" \
            --head-capture-sha256 "$HEAD_CAPTURE_SHA256" \
            --output "$RUNNER_TEMP/evidence/characterization-result.json"
          characterization_status=$?
          cat "$RUNNER_TEMP/evidence/characterization-result.json"
          "$RUNNER_TEMP/gate-venv/bin/python" -P -m supportability_gate.refactor_policy \
            --repository "$GITHUB_WORKSPACE/target" \
            --event "$GITHUB_EVENT_PATH" \
            --characterization-result "$RUNNER_TEMP/evidence/characterization-result.json" \
            --output "$RUNNER_TEMP/evidence/refactor-policy-result.json"
          refactor_status=$?
          cat "$RUNNER_TEMP/evidence/refactor-policy-result.json"
          if [ "$characterization_status" -ne 0 ]; then exit "$characterization_status"; fi
          exit "$refactor_status"

      - name: Evaluate immutable pull-request commits
        id: evaluate
        if: >-
          steps.install.outcome == 'success' &&
          steps.download_quality.outcome == 'success' &&
          steps.artifact_metadata.outcome == 'success'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          QUALITY_ARTIFACT_DIGEST: ${{ needs.quality-profile.outputs.artifact-digest }}
          QUALITY_ARTIFACT_ID: ${{ needs.quality-profile.outputs.artifact-id }}
          QUALITY_CAPTURE_SHA256: ${{ needs.quality-profile.outputs.capture-sha256 }}
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          "$RUNNER_TEMP/gate-venv/bin/python" -P -m supportability_gate evaluate-complexity \
            --repository "$GITHUB_WORKSPACE/target" \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --contract-path .supportability.toml \
            --quality-evidence "$RUNNER_TEMP/quality/quality-gates.json" \
            --quality-repository "$GITHUB_REPOSITORY" \
            --quality-repository-id "$GITHUB_REPOSITORY_ID" \
            --quality-run-id "$GITHUB_RUN_ID" \
            --quality-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --quality-job quality-profile \
            --quality-artifact-id "$QUALITY_ARTIFACT_ID" \
            --quality-artifact-digest "$QUALITY_ARTIFACT_DIGEST" \
            --quality-artifact-metadata "$RUNNER_TEMP/quality/artifact-metadata.json" \
            --quality-capture-sha256 "$QUALITY_CAPTURE_SHA256" \
            --workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --output-directory "$RUNNER_TEMP/evidence"
          status=$?
          cat "$RUNNER_TEMP/evidence/complexity-result.json"
          exit "$status"

      - name: Upload authoritative supportability evidence
        id: upload_evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: supportability-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error

      - name: Enforce aggregate result
        if: always()
        env:
          BASE_RESULT: ${{ needs.characterize-base.result }}
          HEAD_RESULT: ${{ needs.characterize-head.result }}
          QUALITY_RESULT: ${{ needs.quality-profile.result }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BASE_DOWNLOAD_OUTCOME: ${{ steps.download_base.outcome }}
          HEAD_DOWNLOAD_OUTCOME: ${{ steps.download_head.outcome }}
          QUALITY_DOWNLOAD_OUTCOME: ${{ steps.download_quality.outcome }}
          METADATA_OUTCOME: ${{ steps.artifact_metadata.outcome }}
          REFACTOR_OUTCOME: ${{ steps.refactor_policy.outcome }}
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_evidence.outcome }}
        run: |
          status=0
          for result in "$BASE_RESULT" "$HEAD_RESULT" "$QUALITY_RESULT" \
            "$INSTALL_OUTCOME" "$BASE_DOWNLOAD_OUTCOME" "$HEAD_DOWNLOAD_OUTCOME" \
            "$QUALITY_DOWNLOAD_OUTCOME" "$METADATA_OUTCOME" "$REFACTOR_OUTCOME" \
            "$EVALUATE_OUTCOME" "$UPLOAD_OUTCOME"; do
            if [ "$result" != "success" ]; then status=1; fi
          done
          exit "$status"

  supportability-gate:
    name: Supportability Gate
    needs: [collect-codex-review, deterministic-evidence]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce separated connector and deterministic results
        env:
          CONNECTOR_RESULT: ${{ needs.collect-codex-review.result }}
          DETERMINISTIC_RESULT: ${{ needs.deterministic-evidence.result }}
        run: |
          status=0
          for result in "$CONNECTOR_RESULT" "$DETERMINISTIC_RESULT"; do
            if [ "$result" != "success" ]; then status=1; fi
          done
          exit "$status"
