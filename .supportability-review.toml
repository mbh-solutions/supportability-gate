[architecture]
dependency_direction = "The existing direction is preserved: characterization depends only on contract and Git facts; refactor policy consumes characterization evidence; standard results independently validates both; the producer and publisher remain above the deterministic decision layer."
reviewed_paths = [".supportability-review.toml", "docs/product/Eight-Gates.md", "docs/product/Evidence-Model.md", "docs/product/Pull-Request-Lifecycle.md", "docs/product/Refactor-Authorization.md", "docs/product/Repository-Configuration.md", "docs/product/Troubleshooting.md", "src/supportability_gate/characterization.py", "src/supportability_gate/refactor_policy.py", "src/supportability_gate/standard_block_ownership.py", "src/supportability_gate/standard_results.py", "src/supportability_gate/standard_results_producer.py", "tests/test_characterization.py", "tests/test_refactor_policy.py", "tests/test_standard_results.py"]

[responsibility_boundary]
path = "src/supportability_gate/characterization.py"
owns = "Generic correction declarations, authenticated base/head observations, canonical behavior deltas and frozen-oracle evidence identities."
does_not_own = "Trusted-owner authentication, GitHub comments, quality execution, handoff evidence or semantic truth of source receipts."

[incremental_refactor]
target = "Add one bounded behavior-correction transaction without changing the preservation path or protected workflow surface."
completed_step = "Extend manifest and authorization schema 5, verify oracle-first Git history, reconcile only three exact behavior-change families, and carry the result classification through the current authoritative artifact."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Correction, oracle, observed delta and result-classification names describe exact policy facts rather than domain interpretation."
cohesion = "Parsing and observation remain in characterization, authentication remains in refactor policy, and independent aggregate validation remains in standard results."
intended_behavior = "Ordinary refactors remain behavior-preserving. A correction passes only when its oracle is earlier, immutable, exact, fully executed and bound by a fresh trusted-owner authorization."
reviewability = "The change is limited to the existing characterization/refactor/result pipeline, focused tests and reader documentation; the immutable Standard, workflow contexts, thresholds and bypass policy are unchanged."
