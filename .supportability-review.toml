schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Verify each side of a schema-5 module correction against that side's frozen root oracle, including a newly introduced base-side case set declared in the authenticated oracle commit. Ordinary scenarios still use the protected-base module golden."
proof = "Focused tests prove side-specific root-oracle selection and prove that only a declared correction golden activates the new base-side path. Ruff format, lint and C901 checks pass on the changed implementation and tests."

[characterization]
captured_behavior = "Existing module characterizations and corrections without a declared base-side golden retain protected-base lookup. A correction may declare one generic `<scenario>.base.module.golden.json`; verification then reads that frozen head-tree oracle for base execution while retaining the ordinary head module golden for corrected execution."
proof = "The tests exercise distinct verifier inputs and the declaration predicate. Undeclared files cannot activate the path, while missing, malformed, modified or unauthenticated oracle bytes remain blocked by existing parsing and correction-transaction checks."

[separation_of_concerns]
before = "Base-side module verification could read only the protected-base golden, so a correction that introduced a new execution case had no authenticated place to freeze that case's protected-base result."
after = "A declared schema-5 correction may freeze a new base-side module case set in its oracle commit; every ordinary path still reads the protected-base golden, and public evidence shape is unchanged."
boundaries = [
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_api_bindings", before = "Module binding received no correction declaration.", after = "Module binding receives the already parsed manifest so side-specific selection can be restricted to a declared correction oracle." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_module_binding", before = "Base verification always read the protected-base module golden.", after = "Base verification reads a declared correction base golden from the frozen head tree when present; otherwise it preserves protected-base lookup exactly." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_correction_base_module_oracle_path", before = "No correction-specific base-side module-golden identity existed.", after = "Return the fixed generic path only when the scenario and a golden-role file are both present in the correction declaration." },
]

[architecture]
dependency_direction = "The existing direction is preserved: characterization depends only on contract and Git facts; refactor policy consumes characterization evidence; standard results independently validates both; the producer and publisher remain above the deterministic decision layer."
reviewed_paths = [".supportability-review.toml", "docs/product/Repository-Configuration.md", "src/supportability_gate/characterization.py", "tests/test_characterization.py"]

[responsibility_boundary]
path = "src/supportability_gate/characterization.py"
owns = "Generic correction declarations, declared side-specific module-oracle selection, authenticated base/head observations, canonical behavior deltas and frozen-oracle evidence identities."
does_not_own = "Trusted-owner authentication, GitHub comments, quality execution, handoff evidence or semantic truth of source receipts."

[incremental_refactor]
target = "Make oracle-first module corrections prove complete API execution on both sides when the correction adds a new case."
completed_step = "Permit one declared generic base-side module golden in the oracle commit while leaving protected-base lookup unchanged for every ordinary scenario."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Correction, oracle, observed delta and result-classification names describe exact policy facts rather than domain interpretation."
cohesion = "Parsing and observation remain in characterization, authentication remains in refactor policy, and independent aggregate validation remains in standard results."
intended_behavior = "Ordinary refactors remain behavior-preserving. A schema-5 correction may add a base-side case oracle only through the authenticated oracle-file declaration; undeclared or modified bytes cannot satisfy execution."
reviewability = "The change is limited to one fixed path convention, selection inside module binding, focused regression coverage, documentation and this evidence update; workflow contexts, thresholds and bypass policy are unchanged."
