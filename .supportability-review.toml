owner_path = "src/supportability_gate/standard_results.py"
basis = "responsibility"
justification = "This module owns aggregate lane composition and fail-closed cross-binding of changed production sides and lines, renames, functions, touched names, Ruff spans/message complexity, and exact lane ownership."
