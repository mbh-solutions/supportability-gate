schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Document the Gate's implemented behavior with practical owner guidance and source-grounded technical references."
proof = "Documentation link, anchor, example and publication checks; required protected source validation; executable and workflow blob equality."

[characterization]
captured_behavior = "Documentation changes do not alter executable behavior, characterization definitions, or expected results."
proof = "Exact immutable hashes, unchanged executable and workflow blobs, and required hosted base/head checks."

[separation_of_concerns]
before = "Product instructions mix reader guidance, protocol detail and publication history."
after = "The README routes readers to practical guides; configuration and characterization have separate references; delivery identities stay in publication evidence."
boundaries = []

[architecture]
dependency_direction = "Documentation follows the implemented static, isolated execution, evidence and publication boundaries."
reviewed_paths = ["README.md", "docs/product", "docs/maintenance.md"]

[responsibility_boundary]
path = "docs/product"
owns = "Canonical reader instructions, supported contracts, evidence meanings and implementation references."
does_not_own = "Executable policy, workflow configuration, application behavior or deployment enrollment."

[incremental_refactor]
target = "Publish accurate, concise README and wiki documentation without revision narratives."
completed_step = "Organize owner and implementer reading paths, preserve technical detail and compatibility links, and verify publication."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Page names identify practical tasks and technical responsibilities."
cohesion = "Each detailed subject has a primary canonical page."
intended_behavior = "Reader documentation describes implemented behavior in the present tense."
reviewability = "Author declaration only; source protection and normal protected delivery apply."
