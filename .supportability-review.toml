schema_version = "1.0"
module_boundaries = [
  { basis = "responsibility", justification = "Existing owner of fixed adapters, declared coverage and contract anti-weakening.", owner_path = "src/supportability_gate/gate_policy.py", path = "src/supportability_gate/gate_policy.py" },
  { basis = "responsibility", justification = "Existing owner of authenticated Standard composition and exact quality argument binding.", owner_path = "src/supportability_gate/standard_results.py", path = "src/supportability_gate/standard_results.py" },
]

[behavior]
intended_behavior = "Bind admitted TypeScript module tests to their actual commands and require mixed adapter coverage for its admitted source language. Preserve exact manifests, own-language coverage, unclassified file obligations, both Git sides and contract anti-weakening."
proof = "39 focused assertions cover all six TypeScript test suffixes in TypeScript and mixed profiles, missing/extra/substituted/foreign test arguments, all seven mixed adapters, admitted source suffixes, renames/deletions and unclassified assets. Native qualification must confirm valid profiles pass and genuine defects remain BLOCK."

[characterization]
captured_behavior = "Before repair, 19 assertions fail: .mjs/.cjs evidence is rejected and mixed adapters falsely require other-language coverage. Twenty negative or compatible outcomes already hold."
proof = "Retain the pre-fix log and every existing characterization driver/oracle/manifest. Run the complete source suite and protected base/head characterization."

[separation_of_concerns]
before = "The consumer duplicates a source-only suffix list for tests. The coverage policy applies every mixed adapter to both languages."
after = "Command binding uses existing source/test definitions. A responsibility-named selector excludes only admitted other-language source; coverage decisions and anti-weakening remain in the existing policy owner."
boundaries = [
  { path = "src/supportability_gate/gate_policy.py", kind = "function", symbol = "_adapter_coverage_paths", before = "Mixed adapters share unfiltered file obligations.", after = "Select applicable obligations; unknown files and single profiles retain prior scope." },
  { path = "src/supportability_gate/gate_policy.py", kind = "function", symbol = "evaluate_contract", before = "Every adapter must cover every changed/high-risk file in either language.", after = "Apply unchanged coverage failures to each adapter's applicable source paths." },
  { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_quality_argv", before = "Local source suffixes discard admitted .mjs/.cjs tests.", after = "Reuse distinct fixed source/test suffixes with exact executed argument checks." },
]

[architecture]
dependency_direction = "Standard composition already depends on quality_profile. Gate policy retains its contract/source classification dependencies. Target execution remains inside fixed hosted runners."
reviewed_paths = [".supportability-review.toml", "docs/product/Repository-Configuration.md", "src/supportability_gate/gate_policy.py", "src/supportability_gate/standard_results.py", "tests/test_evaluate_complexity.py", "tests/test_standard_results.py"]

[responsibility_boundary]
path = "src/supportability_gate/gate_policy.py"
owns = "Fixed adapter identity, applicable declared coverage and deterministic contract anti-weakening."
does_not_own = "Target execution, command evidence generation, characterization, owner authorization or semantic certification."

[incremental_refactor]
target = "Repair the two Gate 7 qualification failures independently of the runtime inventory repair."
completed_step = "Align argument binding with admitted tests and mixed coverage with fixed language adapters, retaining meaningful positive/negative regressions and product documentation."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Adapter coverage paths names the exact selection responsibility; existing fixed profile definitions still own source/test suffixes."
cohesion = "Coverage selection stays in gate_policy; argument binding stays in standard_results and reuses quality_profile."
intended_behavior = "Admitted module tests and split language scopes pass. Missing/wrong arguments, own-language gaps, threshold changes and candidate narrowing still fail closed."
reviewability = "Two small production edits with 39 focused assertions, retained pre-fix failures and preserved historical oracles; native qualification binds outcomes to actual execution."
