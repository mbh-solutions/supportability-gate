schema_version = "1.0"
module_boundaries = [
  { path = "src/supportability_gate/quality_runner.py", owner_path = "src/supportability_gate/quality_runner.py", basis = "responsibility", justification = "Owns the fixed command plans and construction of the restricted target-execution boundary." },
  { path = "src/supportability_gate/quality_profile.py", owner_path = "src/supportability_gate/quality_profile.py", basis = "responsibility", justification = "Owns validation of quality evidence derived from exact Git objects." },
  { path = "src/supportability_gate/characterization.py", owner_path = "src/supportability_gate/characterization.py", basis = "responsibility", justification = "Owns authenticated characterization capture and environment-provenance verification." },
]

[behavior]
intended_behavior = "Target-controlled quality and characterization commands execute with authenticated source, a fixed read-only Git toolchain and other trusted tools, and the collector mounted read-only; only command scratch is writable; network, privilege escalation, excess processes, and excess memory are denied."
proof = "Hosted tests exercise ordinary Python, TypeScript, and mixed targets plus source blank, source restore, tool overwrite, collector overwrite, and authoritative-evidence overwrite attempts; local tests validate the fixed Git mounts, command construction, exact Git receipts, provenance, and fail-closed drift handling."

[characterization]
captured_behavior = "Before S02, a target test could blank a committed source file and all seven Python quality commands still exited zero while later evidence observed the mutated bytes."
proof = "The retained hosted baseline run records seven zero exits, runner exit zero, the committed pre-run source hash, and the empty-file post-run hash; the replacement fixtures require deterministic denial without authoritative mutation."

[separation_of_concerns]
before = "Target commands, source inputs, trusted tools, collector code, and authoritative outputs shared writable checkout authority, while characterization did not bind exact runtime and dependency provenance."
after = "The runner constructs the fixed restricted container boundary, hosted adapters supervise execution and retain sidecars, and validators independently authenticate exact Git receipts plus quality and characterization provenance."
boundaries = [
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_load_environment_provenance", before = "Characterization environment identity had no independently authenticated sidecar loader.", after = "The verifier loads an exact capture-bound environment provenance sidecar and fails closed on absence or mismatch." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_provenance_path", before = "Characterization had only its legacy capture artifact path.", after = "A deterministic sibling path locates the separately versioned provenance sidecar without changing the capture schema." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_stable_environment", before = "No stable environment identity was available for base and head comparison.", after = "Replay-relevant runtime and dependency fields are compared while unique container instance IDs remain recorded facts." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_valid_environment", before = "Runtime and dependency identities were not structurally validated.", after = "Container digest, executable hashes, and sorted dependency receipts must match the fixed authenticated shape." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "verify_evidence", before = "Base and head characterization accepted no exact environment provenance comparison.", after = "Verification authenticates both provenance sidecars and blocks replay-relevant environment drift." },
  { path = "src/supportability_gate/characterization.py", kind = "module", symbol = "src/supportability_gate/characterization.py", before = "The capture contract had no separately versioned environment provenance contract.", after = "The legacy capture schema remains rolling-compatible while a versioned sidecar carries new provenance." },
  { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "_python_zero_statement_eligible", before = "Zero-statement eligibility could follow mutable coverage observations.", after = "Only an exact Git blob containing no executable Python statement is eligible." },
  { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "_typescript_zero_statement_eligible", before = "TypeScript zero-statement eligibility was not derived from authenticated bytes.", after = "Only an exact Git blob containing whitespace or comments is eligible." },
  { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "source_receipts", before = "The evidence did not bind every source path to its exact Git object and content hash.", after = "Each source path has a Git object receipt, content digest, and independently derived zero-statement decision." },
  { path = "src/supportability_gate/quality_profile.py", kind = "module", symbol = "src/supportability_gate/quality_profile.py", before = "Quality evidence had no typed exact-source receipt or authenticated zero-statement parser.", after = "Typed receipts record exact object identity and content while the standard Python AST classifies zero-statement blobs without importing target code." },
  { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "_mount", before = "Docker mount construction was not centralized or read-only by default.", after = "One helper emits literal bind mounts with read-only ownership as the default." },
  { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "_runtime_mounts", before = "The S02 boundary mounted hosted runtimes and shared libraries but omitted the Git executable and support directories required by target test suites.", after = "The supervisor binds only fixed read-only system libraries, the Git executable and support directories, and the exact Node entry point needed by the mounted hosted runtimes." },
  { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "_sandbox_arguments", before = "Fixed public command vectors and container-visible paths shared one representation.", after = "A compatibility adapter translates authenticated host paths to their exact read-only container mount locations without changing the public command contract." },
  { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "_write_python_configs", before = "Python tools wrote configuration into the target checkout.", after = "Python tool configuration is written only to supervisor-owned scratch with explicit output locations." },
  { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "_write_typescript_configs", before = "TypeScript tools wrote configuration into the target checkout.", after = "TypeScript tool configuration is written only to supervisor-owned scratch with explicit caches and build output." },
  { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "command_plans", before = "Fixed commands addressed the mutable repository directly.", after = "Fixed commands address read-only container paths and supervisor-provided configuration." },
  { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "command_work_directory", before = "Commands shared writable execution state.", after = "Each fixed adapter receives its own supervisor-owned writable directory." },
  { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "container_id_file", before = "Timed-out container identity was not retained outside target authority.", after = "Each adapter has a supervisor-owned container ID file for bounded forced cleanup." },
  { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "provisioning_command", before = "Dependency provisioning was not separated from target command execution.", after = "Provisioning plans execute under their fixed interpreter outside the target phase and are recorded as supervisor observations." },
  { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "sandbox_command", before = "Target code executed with checkout write authority and runner network access.", after = "Target code runs in a digest-pinned read-only container with no network, dropped capabilities, no-new-privileges, and fixed CPU, memory, process, and time bounds." },
  { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "trusted_directory", before = "Trusted configuration and target-writable output had no explicit directory boundary.", after = "Trusted configuration is isolated under supervisor-owned scratch and mounted read-only." },
  { path = "src/supportability_gate/quality_runner.py", kind = "module", symbol = "src/supportability_gate/quality_runner.py", before = "The deployed S02 boundary did not declare the fixed Git support directories required inside the isolated container.", after = "The module fixes the image digest, platform, resource ceilings, safe environment, literal path handling, and read-only Git toolchain mounts." },
]

[architecture]
dependency_direction = "Hosted adapters call the fixed runner boundary and emit public evidence plus separate provenance; pure validators authenticate those artifacts from exact Git data. Target code never owns the collector, trusted tools, or final evidence output."
reviewed_paths = [".github/workflows/organization-required.yml", ".supportability-review.toml", "pyproject.toml", "requirements-dev.lock", "src/supportability_gate/characterization.py", "src/supportability_gate/quality_profile.py", "src/supportability_gate/quality_runner.py", "tests/hosted_characterization.py", "tests/hosted_quality_profile.py", "tests/test_characterization.py", "tests/test_quality_profile.py"]

[responsibility_boundary]
path = "src/supportability_gate/quality_runner.py"
owns = "Fixed target command plans and construction of the digest-pinned restricted execution boundary."
does_not_own = "Repository policy decisions, semantic review, artifact transport, GitHub protection administration, or successor-slice source integrity."

[incremental_refactor]
target = "Isolate target execution and bind exact source, runtime, executable, and dependency provenance without changing the public quality evidence schema or adding another policy engine."
completed_step = "Corrected the hosted characterization call contract and supplied the fixed read-only Git toolchain required by isolated target tests without changing the public evidence schema."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Sandbox, provenance, receipt, execution, and provisioning names distinguish authority and observation source."
cohesion = "Runner construction remains in quality_runner, quality evidence validation remains in quality_profile, characterization verification remains in characterization, and hosted adapters own runner-only orchestration."
intended_behavior = "Target-controlled commands cannot modify authenticated inputs, trusted tools, collectors, or authoritative outputs, and missing or drifting provenance fails closed."
reviewability = "Tests cover fixed Docker and Git mount arguments, safe environment, exact source receipts, provenance authentication, environment drift, runtime setup failures, ordinary language profiles, and five hostile write attempts."
