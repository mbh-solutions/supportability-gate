[architecture]
dependency_direction = "Dependency flow remains one way: git_changes, contract, and function_changes feed refactor_targets; characterization and cli publish separate evidence; refactor_policy consumes exact targets plus Gate 5 evidence; standard_results cross-validates serialized producer facts. No target repository code is imported or executed."
reviewed_paths = [
    ".supportability-characterization.json",
    ".supportability-review.toml",
    "docs/product_completion_contract.md",
    "pyproject.toml",
    "src/supportability_gate/characterization.py",
    "src/supportability_gate/cli.py",
    "src/supportability_gate/function_changes.py",
    "src/supportability_gate/refactor_policy.py",
    "src/supportability_gate/refactor_targets.py",
    "src/supportability_gate/reporting.py",
    "src/supportability_gate/standard_results.py",
    "tests/characterization/gate2-standard-results-boundary.characterization.py",
    "tests/characterization/gate2-standard-results-boundary.golden.json",
    "tests/characterization/gate6-standard-results-boundary.characterization.py",
    "tests/characterization/gate6-standard-results-boundary.golden.json",
    "tests/test_characterization.py",
    "tests/test_evaluate_complexity.py",
    "tests/test_refactor_policy.py",
    "tests/test_standard_results.py",
]

[responsibility_boundary]
path = "src/supportability_gate/refactor_targets.py"
owns = "Exact bounded responsibility targets and unbounded production paths derived from immutable base and head Git blobs for Python and TypeScript or TSX changes."
does_not_own = "Owner authentication, predecessor API retrieval, Gate 5 policy, aggregate lane composition, target execution, commands, thresholds, exclusions, waivers, or later-slice behavior."

[incremental_refactor]
target = "Qualify only Supportability 6 with exact authenticated authorization, immediate predecessor sequence, source-derived targets, and independently runnable Gate 5 evidence."
completed_step = "Added one shared target-assembly boundary, authenticated producer evidence, aggregate shape validation and cross-binding, versioned behavior characterization, and direct Python/frontend poison and isolation proof."

[review_handoff]
summary = "S08 candidate qualifies Gate 6 only. It adds no third-party package dependency, target-code execution, command, waiver, threshold, or later-slice behavior. Deterministic proof, eight serial focused reviews, final-head checks, normal protected merge, and Python/frontend canaries remain required before S08 completion."
remaining_risks = [
    "Focused review may identify a supported defect requiring one bounded remediation batch.",
    "Hosted exact-head proof and both never-merge canaries remain pending until the candidate PR is frozen and reviewed.",
]

[human_review]
naming = "refactor_targets, PredecessorEvidence, refactor_runnability, responsibility_targets, and unbounded_production_paths state their single owned facts."
cohesion = "Target assembly, authorization policy, characterization evidence, result serialization, and aggregate cross-validation remain separate named boundaries."
intended_behavior = "Every required Gate 6 poison maps to its exact owned block, valid bounded Python/frontend increments pass, and other seven Standard lanes remain unchanged."
reviewability = "One S08 slice contains direct boundary rows, exact producer-to-aggregate bindings, a retained baseline canary, and focused tests for every trust-boundary edge found during local audit."

[[module_boundaries]]
path = "src/supportability_gate/refactor_targets.py"
owner_path = "src/supportability_gate/refactor_targets.py"
basis = "responsibility"
justification = "One new module owns parser-backed target and unbounded-path derivation reused by complexity evidence and Gate 6 policy."
