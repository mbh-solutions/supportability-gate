schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Preserve the schema-5 correction lane while recognizing a dependency-level behavior correction when a declared scenario has a changed characterization definition and both base and head execute successfully to the same non-null module hash. Missing execution, failed execution, undeclared changes and absent obligation deltas remain fail-closed."
proof = "Three focused schema-5 evidence tests cover the ordinary delta, hidden or absent declarations, and the bounded stable-module-hash dependency case. Ruff formatting and lint remain clean."

[characterization]
captured_behavior = "Schemas 1-4 remain unchanged. Schema 5 now distinguishes an executed dependency-level scenario from an absent declaration: the scenario definition must change, both observations must be non-null and equal, and the definition change remains review-visible and reconcilable."
proof = "The focused dependency test proves acceptance only with equal non-null base/head hashes and an exact CHANGED_CHARACTERIZATION_DEFINITION block; the existing hidden-delta test continues to block mismatched declarations."

[separation_of_concerns]
before = "Schema 5 required every declared scenario identifier to have a changed module behavior hash, even when an executed scenario exposed changed dependency behavior through a changed frozen definition while its own module source hash stayed stable."
after = "Characterization accepts that narrow dependency-level case only when the declared definition changed and both base and head executions produced the same non-null module hash; obligations and all other declared scenarios retain their existing delta requirements."
boundaries = [
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_correction_evidence", before = "A declared scenario was present only in actual_scenarios when its base and head module behavior hashes differed.", after = "A declared scenario is also satisfied when its definition changed and both executions produced the same non-null module hash; failed or missing execution and absent obligation deltas still block." },
]

[architecture]
dependency_direction = "The existing direction is preserved: characterization depends only on contract and Git facts; refactor policy consumes characterization evidence; standard results independently validates both; the producer and publisher remain above the deterministic decision layer."
reviewed_paths = [".supportability-review.toml", "src/supportability_gate/characterization.py", "tests/test_characterization.py"]

[responsibility_boundary]
path = "src/supportability_gate/characterization.py"
owns = "Generic correction declarations, authenticated base/head observations, canonical behavior deltas and frozen-oracle evidence identities."
does_not_own = "Trusted-owner authentication, GitHub comments, quality execution, handoff evidence or semantic truth of source receipts."

[incremental_refactor]
target = "Represent dependency-level behavior corrections without forcing unrelated production-file edits or weakening execution evidence."
completed_step = "Recognize one declared stable-module-hash scenario only when its frozen definition changed and both sides executed; preserve every obligation and unrelated-block requirement."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Correction, oracle, observed delta and result-classification names describe exact policy facts rather than domain interpretation."
cohesion = "Parsing and observation remain in characterization, authentication remains in refactor policy, and independent aggregate validation remains in standard results."
intended_behavior = "Ordinary refactors remain behavior-preserving. A schema-5 dependency correction requires a changed frozen definition plus successful base and head execution; it cannot substitute for a missing obligation delta."
reviewability = "The change is one bounded branch in _correction_evidence, one focused regression test and this evidence update; workflow contexts, thresholds and bypass policy are unchanged."
