schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "The required Supportability workflow and shipped Gate package depend only on eight deterministic lanes. The producer writes standard-results.v3 with empty stdout. Codex review is owner opt-in advisory input outside qualification, merge, and completion."
proof = "tests/test_standard_results.py::test_producer_writes_valid_evidence_without_stdout; tests/test_standard_results.py::test_workflow_keeps_advisory_review_out_of_the_required_path; .github/workflows/organization-required.yml"

[characterization]
captured_behavior = "The protected base shipped dormant connector and focused-review modules, derived a review-required Boolean, printed it from the producer, and carried dead workflow output validation. The head deletes those modules and characterizations and removes every review-required signal while preserving the deterministic artifact and eight lane enforcers."
proof = "tests/characterization/standard-results-boundary.characterization.py; tests/characterization/standard-results-boundary.golden.json; tests/characterization/gate8-standard-results-boundary.golden.json"

[separation_of_concerns]
before = "Dormant connector transport and focused-review policy remained packaged beside deterministic enforcement, and the deterministic producer exposed an unused connector decision."
after = "The package and required workflow own deterministic evidence only. Owner-requested Codex review remains external advisory activity; native review-thread resolution governs any resulting inline conversation."
[architecture]
dependency_direction = "Required enforcement flows from authenticated source evidence into standard-results.v3 and eight lane enforcers. No required module, workflow job, output, environment variable, or aggregate decision depends on Codex connector state."
reviewed_paths = [
    ".github/workflows/organization-required.yml",
    ".supportability-characterization.json",
    ".supportability-review.toml",
    "AGENTS.md",
    "docs/product_completion_contract.md",
    "pyproject.toml",
    "src/supportability_gate/codex_review.py",
    "src/supportability_gate/focused_review.py",
    "src/supportability_gate/standard_results.py",
    "src/supportability_gate/standard_results_producer.py",
    "tests/characterization/codex-review-boundary.characterization.py",
    "tests/characterization/focused-review-contract.characterization.py",
    "tests/characterization/standard-results-boundary.characterization.py",
    "tests/test_codex_review.py",
    "tests/test_standard_results.py",
]

[responsibility_boundary]
path = ".github/workflows/organization-required.yml"
owns = "Authenticated deterministic evidence production, exactly eight Standard contexts, their artifacts, and aggregate deterministic result."
does_not_own = "Codex requests, connector availability, acknowledgement, completion, retries, advisory judgment, or optional review scheduling."

[incremental_refactor]
target = "Retire connector coupling without changing deterministic schemas, contexts, thresholds, artifacts, target execution, or GitHub protection."
completed_step = "Deleted dormant connector code and its tests and characterizations, removed the producer Boolean and workflow plumbing, and retained the existing deterministic enforcement path."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "The remaining production modules and workflow values describe deterministic evidence only; the removed review-required names no longer imply a connector prerequisite."
cohesion = "Connector transport and focus policy are deleted. Standard result composition, production, enforcement, and workflow orchestration retain their existing separate responsibilities."
intended_behavior = "A push, failure, timeout, or prior request cannot trigger or retry Codex review. Exactly eight deterministic contexts remain the required enforcement surface."
reviewability = "The executable diff is deletion-led: two dormant modules, their tests and characterizations, one Boolean function, one stdout line, and dead workflow plumbing are removed. No package, command vector, threshold, exclusion, waiver, schema, context name, target-code execution, or bypass is added."

