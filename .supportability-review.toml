  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_legacy_result_coverage", before = "The v2 result consumer could not strictly validate retained v1 path coverage during deployment.", after = "Legacy results retain their exact v1 path-coverage grammar while new v2 results bind obligations." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_manifest_payload", before = "Manifest provenance represented scenarios only.", after = "Canonical provenance includes obligations and digest-bound transitions." },
