schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Hosted characterization prepares each exact target commit's Python runtime dependencies before running head-defined scenarios; failed prerequisites stop capture."
proof = "Focused runtime-preparation regression and the required exact source proof; protected source and consumer qualification are independently required."

[characterization]
captured_behavior = "The previous hosted runner supplied only Gate dependencies. A target scenario could lack runtime imports, and TWMN's old driver fabricated success after ImportError."
proof = "The focused setup regression must fail against the previous runner. Immutable Gate characterization definitions and production source remain unchanged."

[separation_of_concerns]
before = "The hosted runner authenticated checkouts then immediately executed scenarios without target dependency preparation."
after = "The same runner prepares prerequisites in a temporary directory given only to scenario subprocesses. The static evaluator remains unchanged."
boundaries = []

[architecture]
dependency_direction = "Hosted infrastructure consumes the existing immutable Git reader and characterization contract. No production imports, packages, modules, or evaluator execution paths change."
reviewed_paths = ["tests/hosted_characterization.py", "tests/test_characterization.py", ".github/workflows/organization-required.yml", "src/supportability_gate/characterization.py"]

[responsibility_boundary]
path = "tests/hosted_characterization.py"
owns = "Authenticated hosted capture and fixed isolated preparation of static index-based Python runtime dependencies."
does_not_own = "Target packaging hooks, arbitrary commands or indexes, static evaluation, quality adapters, thresholds, or production ingestion."

[incremental_refactor]
target = "Repair the missing prerequisite in the existing hosted characterization boundary."
completed_step = "One runner prepares dependencies without changing production source, contracts, recorded driver commands, or workflow topology."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Dependency preparation names the actual prerequisite; no installer framework."
cohesion = "Hosted capture owns preparation; trusted evaluation remains static and separate."
intended_behavior = "Malformed, unsupported, missing, or failed prerequisites stop capture rather than fabricate behavior."
reviewability = "One runner and its existing regression module. No new package, configuration surface, threshold, or scope exception. The consumer replacement is a separate protected TWMN PR."
