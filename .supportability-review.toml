schema_version = "1.0"
module_boundaries = []
[behavior]
intended_behavior = "This S17 completion transaction records source and hosted summary evidence; it changes no production behavior."
proof = "Protected source PR #199 and native summary run 33940238325 provide the recorded evidence; this documentation-only transaction receives its own protected checks."

[characterization]
captured_behavior = "The existing enforcer validates exact identity and sources before printing its canonical row and returning the mapped exit code."
proof = "Existing immutable gate8-standard-results-boundary-v3 and m9-quality-profile scenarios retain their drivers and golden bytes. Summary opt-in defaults off so synthetic callers retain their current behavior."

[separation_of_concerns]
boundaries = []
before = "The prior implementation PR carried seven changed production responsibility identities."
after = "This documentation-only completion PR changes no production responsibility, so its exact boundary record set is empty."

[architecture]
dependency_direction = "The outer enforcer consumes the existing inward reporting module. Reporting receives only validated entry fields and never imports the enforcer or adds evidence collection."
reviewed_paths = ["src/supportability_gate/reporting.py", "src/supportability_gate/standard_results_enforcer.py", ".github/workflows/organization-required.yml"]

[responsibility_boundary]
path = "src/supportability_gate/reporting.py"
owns = "Source-faithful presentation of validated result codes and bounded explanations."
does_not_own = "Policy decisions, authorization, evidence validation, target execution, thresholds, or independent qualification."

[incremental_refactor]
target = "Expose existing Gate results in native GitHub job summaries."
completed_step = "The existing enforcement caller opts into presentation; canonical artifacts and checks remain authoritative."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Summary names describe their presentation responsibility; no generic utility module."
cohesion = "Formatting stays in reporting; validation and isolated optional output stay in the existing enforcer."
intended_behavior = "Missing or invalid evidence receives no invented diagnosis; unsupported codes remain visible. Summary failure preserves the Gate result."
reviewability = "Two existing production modules and their workflow caller; no new dependency, schema, policy, target contract control, waiver, or consumer change."
