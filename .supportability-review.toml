[responsibility_boundary]
path = "src/supportability_gate/standard_results.py"
owns = "Validation and composition of eight independently owned deterministic lane results, including exact review-field and typed-stage ownership."
does_not_own = "Target command execution, semantic judgment, owner authentication, protection administration, or successor-slice source integrity."

[incremental_refactor]
target = "Complete S01 evidence ownership and structured failure diagnostics without changing lane identities or adding another policy engine."
completed_step = "Normalized review sections, type-guarded hostile payloads, retained versioned stage diagnostics, exposed evidence classes, and preserved summary isolation."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Stage, diagnostic, evidence-class, and ownership names identify existing responsibilities and distinguish policy blocks from technical failures."
cohesion = "Review normalization remains in review_evidence; canonical validation remains in standard_results; stage transport remains in the producer and hosted adapters; reporting remains presentation-only."
intended_behavior = "Absent or malformed evidence cannot become PASS, unaffected lanes remain independent, and failed-stage causes stay actionable without rerun."
reviewability = "Scoped tests cover red reproductions, lane routing, subprocess exits, nested-type fuzzing, duplicate keys, replay identity, bounded logs, redaction, and decision-neutral summaries."
