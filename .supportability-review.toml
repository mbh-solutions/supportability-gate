schema_version = "1.0"

[behavior]
intended_behavior = "Replace the aggregate Gate result with eight independent Standard results while retaining one shared evidence evaluation and exact serial Codex binding."
proof = "tests/test_standard_results.py; tests/test_codex_review.py; .github/workflows/organization-required.yml"

[characterization]
captured_behavior = "Existing CLI, refactor, connector, quality, architecture, and modularity behavior remains covered; the new composer reuses their evidence without rerunning target analysis."
proof = ".supportability-characterization.json; tests/characterization; tests/test_standard_results.py"

[separation_of_concerns]
before = "The aggregate workflow coupled Codex completion to the Standard 6 refactor result and collapsed all policy outcomes into one check."
after = "The refactor policy emits only Standard 6 evidence; one composer binds shared evidence once and eight matrix jobs enforce one fixed entry each."

[architecture]
dependency_direction = "The workflow produces existing evidence before standard_results reads it; matrix consumers validate the producer artifact and never call target analyzers."
reviewed_paths = [
    ".github/workflows/organization-required.yml",
    "src/supportability_gate/codex_review.py",
    "src/supportability_gate/refactor_policy.py",
    "src/supportability_gate/review_evidence.py",
    "src/supportability_gate/standard_results.py",
]

[responsibility_boundary]
path = "src/supportability_gate/standard_results.py"
owns = "Exact eight-entry composition, block ownership, shared trust failure propagation, evidence binding, and single-entry enforcement."
does_not_own = "Target analysis, policy thresholds, connector judgment, owner authorization, ruleset mutation, or product code."

[incremental_refactor]
target = "One S08 workflow transition from the aggregate result to eight fixed Standard results."
completed_step = "Added the composer, decoupled connector completion from refactor evidence, expanded serial focus binding, and wired the fixed matrix without changing target commands or dependencies."

[review_handoff]
summary = "S08 changes only Gate policy, evidence composition, workflow wiring, request instructions, import and characterization contracts, and directly required tests. The immutable Standard, frozen roadmap, target commands, thresholds, exclusions, waivers, and consumer product code are unchanged."
remaining_risks = [
    "Codex review remains probabilistic and connector latency can require a new exact-head run.",
    "The eight contexts become required only through the separately verified source and consumer ruleset migration and DC never-merge canary.",
]

[human_review]
naming = "Each check, focus, evidence field, and module names one Standard or one shared trust boundary."
cohesion = "standard_results owns composition and enforcement; existing analyzers retain their prior responsibilities."
intended_behavior = "One ordinary policy defect blocks only its owned lane; shared trust corruption makes all eight lanes technical failures."
reviewability = "Focused fixtures prove each lane, all lanes together, every declared family owner, malformed bindings, and exact workflow text."

[[module_boundaries]]
path = "src/supportability_gate/standard_results.py"
owner_path = "src/supportability_gate/reporting.py"
basis = "responsibility"
justification = "The new module owns only transformation and enforcement of already-produced result artifacts; reporting remains the pre-existing owner of authoritative evaluation serialization."
