schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "README.md gives adopters a concise, current overview of the completed product, eight deterministic required checks, committed repository inputs, exact CLI surface, evidence artifacts, exit codes, and the long-form wiki."
proof = "README.md; src/supportability_gate/cli.py; src/supportability_gate/reporting.py; src/supportability_gate/standard_results.py; .github/workflows/organization-required.yml; docs/product_completion_contract.md"

[characterization]
captured_behavior = "The base README called Project #10 active and omitted current CLI and evidence details. The head updates documentation only; production code, workflows, contracts, thresholds, and runtime behavior are unchanged."
proof = "README.md; git diff of the authenticated base and head; docs/product_completion_contract.md"

[separation_of_concerns]
before = "The README mixed stale project status with an incomplete adopter path and omitted several current interface details."
after = "The README remains a concise overview and directs long-form operational material to the wiki while naming the current required checks, inputs, CLI outputs, and boundaries."
boundaries = []

[architecture]
dependency_direction = "README.md describes existing repository and hosted-workflow behavior but does not define or alter enforcement; authoritative behavior remains owned by source, workflows, the immutable Standard, and the completion contract."
reviewed_paths = [
    ".supportability-review.toml",
    "README.md",
]

[responsibility_boundary]
path = "README.md"
owns = "A concise adopter-facing overview, start links, current interface summary, and repository boundaries."
does_not_own = "Normative Standard text, product status evidence, executable enforcement, workflow policy, rulesets, or detailed wiki procedures."

[incremental_refactor]
target = "Refresh the adopter overview and establish a matching manual wiki snapshot without changing executable behavior or protected repository policy."
completed_step = "Updated README.md and its authenticated review handoff as one bounded documentation pull request; wiki publication remains a separate wiki-repository commit after merge."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Required context names, input filenames, CLI flags, artifact names, schema version, and exit codes match their authoritative sources."
cohesion = "README.md stays concise; detailed architecture, lifecycle, evidence, module, and validation material is reserved for the wiki."
intended_behavior = "The documentation reports the existing deterministic enforcement and advisory Codex boundary without changing either."
reviewability = "The pull request changes README.md plus this required handoff evidence only. It changes no production code, workflow, package, command vector, threshold, exclusion, waiver, ruleset, or bypass."
