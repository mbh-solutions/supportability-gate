schema_version = "1.0"
module_boundaries = [
  { path = "src/supportability_gate/quality_runner.py", owner_path = "src/supportability_gate/quality_runner.py", basis = "responsibility", justification = "Owns the fixed command plans and construction of the restricted target-execution boundary." },
  { path = "src/supportability_gate/quality_profile.py", owner_path = "src/supportability_gate/quality_profile.py", basis = "responsibility", justification = "Owns validation of quality evidence derived from exact Git objects." },
  { path = "src/supportability_gate/characterization.py", owner_path = "src/supportability_gate/characterization.py", basis = "responsibility", justification = "Owns authenticated characterization capture and environment-provenance verification." },
]

[behavior]
intended_behavior = "Target-controlled quality and characterization commands execute with authenticated source, a fixed read-only Git toolchain and other trusted tools, and the collector mounted read-only; only command scratch is writable; network, privilege escalation, excess processes, and excess memory are denied."
proof = "Hosted tests exercise ordinary Python, TypeScript, and mixed targets plus source blank, source restore, tool overwrite, collector overwrite, and authoritative-evidence overwrite attempts; local tests validate the fixed Git mounts, command construction, exact Git receipts, provenance, and fail-closed drift handling."

[characterization]
captured_behavior = "Before S02, a target test could blank a committed source file and all seven Python quality commands still exited zero while later evidence observed the mutated bytes."
proof = "The retained hosted baseline run records seven zero exits, runner exit zero, the committed pre-run source hash, and the empty-file post-run hash; the replacement fixtures require deterministic denial without authoritative mutation."

[separation_of_concerns]
before = "Target commands, source inputs, trusted tools, collector code, and authoritative outputs shared writable checkout authority, while characterization did not bind exact runtime and dependency provenance."
after = "The runner constructs the fixed restricted container boundary, hosted adapters supervise execution and retain sidecars, and validators independently authenticate exact Git receipts plus quality and characterization provenance."
boundaries = [
  { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "_runtime_mounts", before = "The S02 boundary mounted hosted runtimes and shared libraries but omitted the Git executable and support directories required by target test suites.", after = "The supervisor binds only fixed read-only system libraries, the Git executable and support directories, and the exact Node entry point needed by the mounted hosted runtimes." },
  { path = "src/supportability_gate/quality_runner.py", kind = "module", symbol = "src/supportability_gate/quality_runner.py", before = "The deployed S02 boundary did not declare the fixed Git support directories required inside the isolated container.", after = "The module fixes the image digest, platform, resource ceilings, safe environment, literal path handling, and read-only Git toolchain mounts." },
]

[architecture]
dependency_direction = "Hosted adapters call the fixed runner boundary and emit public evidence plus separate provenance; pure validators authenticate those artifacts from exact Git data. Target code never owns the collector, trusted tools, or final evidence output."
reviewed_paths = [".github/workflows/organization-required.yml", ".supportability-review.toml", "pyproject.toml", "requirements-dev.lock", "src/supportability_gate/characterization.py", "src/supportability_gate/quality_profile.py", "src/supportability_gate/quality_runner.py", "tests/hosted_characterization.py", "tests/hosted_quality_profile.py", "tests/test_characterization.py", "tests/test_quality_profile.py"]

[responsibility_boundary]
path = "src/supportability_gate/quality_runner.py"
owns = "Fixed target command plans and construction of the digest-pinned restricted execution boundary."
does_not_own = "Repository policy decisions, semantic review, artifact transport, GitHub protection administration, or successor-slice source integrity."

[incremental_refactor]
target = "Isolate target execution and bind exact source, runtime, executable, and dependency provenance without changing the public quality evidence schema or adding another policy engine."
completed_step = "Corrected the hosted characterization call contract and supplied the fixed read-only Git toolchain required by isolated target tests without changing the public evidence schema."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Sandbox, provenance, receipt, execution, and provisioning names distinguish authority and observation source."
cohesion = "Runner construction remains in quality_runner, quality evidence validation remains in quality_profile, characterization verification remains in characterization, and hosted adapters own runner-only orchestration."
intended_behavior = "Target-controlled commands cannot modify authenticated inputs, trusted tools, collectors, or authoritative outputs, and missing or drifting provenance fails closed."
reviewability = "Tests cover fixed Docker and Git mount arguments, safe environment, exact source receipts, provenance authentication, environment drift, runtime setup failures, ordinary language profiles, and five hostile write attempts."
