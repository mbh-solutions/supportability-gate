schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Accept Node LCOV ignored-line accounting while deriving coverage only from positive explicit line records. Preserve malformed-proof rejection and retain bounded failure diagnostics."
proof = "Direct positive/negative LCOV parser tests, retention-on-parse-failure regression, and fixed isolated hosted Node coverage probes with type-only source and uncalled functions."

[characterization]
captured_behavior = "Existing quality-profile command and result characterization remains unchanged. Node native coverage probes measure real source-mapped test execution."
proof = "Existing m9-quality-profile and quality-runner-boundary scenarios remain frozen; exact final source and consumer qualification validate preserved isolation and execution requirements."

[separation_of_concerns]
before = "LCOV parsing required aggregate hit counts to equal explicit executed lines, and orchestration retained the trace only after parsing succeeded."
after = "The parser validates native accounting without inventing execution, while orchestration retains bounded diagnostic evidence before parsing."
boundaries = [
  { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "_lcov_executed_line", before = "Parse positive execution counts.", after = "Also validate unique positive line identities and record all reported lines." },
  { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "_store_lcov_record", before = "Require hit totals equal explicit positive line count.", after = "Reconcile omitted ignored-line totals without assigning them execution." },
  { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "_lcov_records", before = "Collect only positive line identities.", after = "Track all explicit line identities for exact accounting." },
  { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "typescript_lcov_observation", before = "Use aggregate hits for the file execution prerequisite.", after = "Require an explicit positive line record, including when no responsibility range is supplied." }
]

[architecture]
dependency_direction = "Hosted orchestration calls the deterministic quality-profile reader. The reader does not depend on orchestration or execute target source."
reviewed_paths = ["src/supportability_gate/quality_profile.py"]

[responsibility_boundary]
path = "src/supportability_gate/quality_profile.py"
owns = "Fixed quality evidence parsing, accounting, and coverage decisions."
does_not_own = "Consumer test behavior, sandbox setup, owner permission, or policy waivers."

[incremental_refactor]
target = "Repair the LCOV accounting and lost diagnostic evidence exposed by a legitimate TypeScript consumer."
completed_step = "Accept the fixed Node reporter format while preserving explicit execution coverage and invalid-proof rejection."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Reported lines and executed lines name separate evidence sets."
cohesion = "Existing parser and hosted orchestration retain their own responsibilities; no new production module."
intended_behavior = "Type-only omitted rows do not block valid native reports and never provide runtime credit. Uncalled bodies and malformed traces remain blocking."
reviewability = "Author declaration only. Existing immutable policy, source integrity, isolated execution, and protected delivery remain mandatory."
