schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Admit at most 64 total evidence scenarios while preserving the 50 observed-API quota and every existing coverage, compatibility, authentication and resource requirement."
proof = "Focused total/API overflow, serialized consumer and lossless transport controls; actual fixed-container 64 mixed-row canary in native source validation; mandatory exact-head source proof and independent review."

[characterization]
captured_behavior = "Every retained driver, golden and obligation identity remains unchanged. The only capture change is compact canonical transport; source observations and actual-byte provenance binding are preserved."
proof = "Existing retained hosted base/head proof, focused byte/digest boundaries, genuine native fixed-container rows, complete S5/shared consumer roundtrip and unchanged adversarial evidence."

[separation_of_concerns]
before = "Total scenario capacity and observed API capacity are implicitly coupled at 50, and capture indentation can exhaust the reader byte envelope."
after = "Characterization retains distinct finite quotas and emits complete compact machine captures; hosted collection and existing verifier/authentication responsibilities remain unchanged."
boundaries = [
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_result_api_facts", before = "A fixed literal admits at most 50 observed API facts.", after = "The same unchanged 50-API quota uses the named observed capacity constant." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_result_scenarios", before = "Serialized results admit at most 50 total scenarios.", after = "Serialized results admit at most 64 total scenarios with every prior shape/equality check intact." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_scenario_rows", before = "The total 50-row guard implicitly limits observed APIs to 50.", after = "A fixed 64-total guard and explicit 50-observed guard reject overflow before target execution." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_write_json", before = "All JSON output uses deterministic sorted indented encoding.", after = "Only explicitly selected machine capture output uses canonical compact JSON plus newline; default result/sidecar output remains indented." },
  { path = "src/supportability_gate/characterization.py", kind = "module", symbol = "src/supportability_gate/characterization.py", before = "The module owns finite characterization admission and deterministic source-bound proof.", after = "The same module owns coherent fixed total/observed quotas and lossless capture transport; no new layer or configurable override." },
]

[architecture]
dependency_direction = "No new production module, dependency, policy engine, protocol schema or workflow. Fixed hosted capture executes targets; static verification consumes source-bound evidence."
reviewed_paths = [".supportability-review.toml", "docs/product/Repository-Configuration.md", "src/supportability_gate/characterization.py", "tests/hosted_characterization.py", "tests/test_characterization_capacity.py", "tests/test_native_capacity_endpoint.py"]

[responsibility_boundary]
path = "src/supportability_gate/characterization.py"
owns = "Deterministic finite scenario admission, source-bound compatibility and complete machine capture serialization."
does_not_own = "Owner authentication, deployment/adoption, qualitative judgment, consumer scope exclusion, trading or environment operation."

[incremental_refactor]
target = "Issue 274 bounded total-scenario capacity and complete capture transport repair."
completed_step = "Prepare fixed 64-total/50-observed admission and compact captures with unchanged remaining resource limits and legacy proof."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Scenario and observed API capacity names identify distinct fixed resource quotas; compact marks explicit transport encoding."
cohesion = "Only finite characterization admission and lossless capture output change; every prior deterministic quality/behavior/owner obligation is retained."
intended_behavior = "Complete evidence may use 64 total scenarios, with at most 50 exact observed APIs, without dropping coverage or increasing byte/time/container budgets."
reviewability = "Five exact production boundaries, focused resource controls, a real native mixed endpoint canary and independent exact-revision review make the change bounded and inspectable."
