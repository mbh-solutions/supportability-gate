schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Reject any oracle edit in implementation ancestry, including edits restored before final head, and credit actual meaningful corrected obligations while retaining raw compatibility changes."
proof = "Focused history controls cover golden and manifest edits, restoration, merged branches and unavailable Git history. Correction coverage controls retain execution, API, replay, golden and authentication failures and reject absent or nonmeaningful assertions."

[characterization]
captured_behavior = "Ordinary preservation and older schema coverage retain their existing compatibility predicate. Schema-5 correction evidence preserves raw incompatibility and requires exact owner reconciliation. Every implementation descendant must retain frozen oracle bytes."
proof = "The existing valid transaction remains admitted before each history mutation; every mutated/restored variant blocks. Producer and result validation share coverage derivation; technical evidence failures prevent correction coverage credit."

[separation_of_concerns]
before = "Endpoint-only oracle comparison missed intermediate edits; coverage confused expected corrected behavior with absence of observation."
after = "Refactor policy independently verifies historical oracle immutability. Characterization derives observed coverage while preserving raw compatibility and owner authentication boundaries."
boundaries = [
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_obligation_evidence", before = "Unobserved obligations evaluated meaningfulness at head only.", after = "Declared corrections require meaningful selected assertions on both sides and retain a blocking mismatch if either is invalid." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_result_coverage", before = "Aggregate coverage required raw compatibility PASS for every obligation.", after = "Aggregate validation derives the same narrowly eligible correction coverage as the producer." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "validate_result", before = "The result consumer passed no correction coverage identity into validation.", after = "Pass only correction IDs whose declaration and technical evidence permit coverage; retain all independent result checks." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "verify_evidence", before = "Coverage was finalized before active correction evidence could be considered.", after = "Compute active correction identity before coverage, retaining raw blocks and final authorization requirements." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_correction_coverage_ids", before = "No owner of provisional correction coverage eligibility existed.", after = "Return declared correction obligations only when the delta is valid and no unreconciled technical characterization block remains." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_verified_obligation_coverage", before = "A changed but executed obligation could not prove target coverage.", after = "Keep ordinary coverage unchanged and additionally credit eligible meaningful correction assertions observed on both sides." },
  { path = "src/supportability_gate/refactor_policy.py", kind = "function", symbol = "_correction_history_blocks", before = "Only oracle and final-head bytes were compared.", after = "Compare frozen paths at every descendant commit on oracle-to-head ancestry, including merged branches, using literal Git path arguments." },
  { path = "src/supportability_gate/refactor_policy.py", kind = "function", symbol = "_correction_transaction_blocks", before = "The transaction verified ancestry, scope and endpoint byte identity.", after = "Also require the complete implementation ancestry to preserve oracle bytes, failing closed when history cannot be inspected." },
]

[architecture]
dependency_direction = "Preserved: characterization owns capture and coverage facts; refactor policy owns Git transaction authentication; authoritative results revalidate retained facts above those layers."
reviewed_paths = [".supportability-review.toml", "docs/product/Repository-Configuration.md", "src/supportability_gate/characterization.py", "src/supportability_gate/refactor_policy.py", "tests/test_characterization.py", "tests/test_refactor_policy.py"]

[responsibility_boundary]
path = "src/supportability_gate/refactor_policy.py"
owns = "Exact owner-authorized refactor and correction transactions, including immutable oracle ancestry."
does_not_own = "Target-native execution, semantic truth of source receipts, quality commands, reviewer services or GitHub protection configuration."

[incremental_refactor]
target = "Close two concrete transaction gaps while preserving existing protections."
completed_step = "Enforce full oracle ancestry and admit proven declared correction coverage without suppressing technical failures or raw compatibility evidence."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Oracle history, correction eligibility and obligation coverage describe the exact facts each function owns."
cohesion = "History inspection stays in refactor policy and coverage derivation stays in characterization, with one shared derivation for producer and consumer."
intended_behavior = "Frozen oracle bytes cannot change temporarily; corrected observations cover changed targets only with complete technical proof and separate exact authorization."
reviewability = "Eight precise function boundaries, focused controls, and documentation; no workflow, required-context, timeout, threshold, scope or bypass changes."
