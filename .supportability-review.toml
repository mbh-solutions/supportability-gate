schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Supportability 7 accepts only fixed stack-native quality commands that actually execute in a GitHub-hosted job, cover every changed and high-risk production path, and bind exact identity, argv, results, scope, thresholds, exclusions, untested areas, and authenticated artifact bytes."
proof = "tests/test_quality_profile.py; tests/test_standard_results.py"

[characterization]
captured_behavior = "The version-aware Gate 7 standard-results scenario remains byte-compatible across the protected v3 baseline and v5 head while directly checking trusted coverage restoration, fixed Python and TypeScript argv, executed-argv provenance, canonical templates, exact source/test manifest expansion, freshly authenticated argv-poison rejection, and exact artifact reconstruction without target execution. Hosted tests cover hostile measurement/report mutation and a real TSX component."
proof = "tests/characterization/gate7-standard-results-boundary.characterization.py; tests/characterization/gate7-standard-results-boundary.golden.json; tests/test_quality_profile.py; tests/test_standard_results.py"

[separation_of_concerns]
before = "Quality decisions and run provenance were split for reporting, but the aggregate did not reconstruct the authenticated source artifact, exact executed argv was absent, target coverage configuration could alter results, and malformed quality semantics could contaminate independent lanes."
after = "quality_profile owns fixed decisions and exact argv provenance; quality_runner restores generated trusted configuration after target execution; standard_results binds executed argv to the approved template expansion, reconstructs authenticated bytes, confines malformed quality evidence to Gates 4 and 7, and routes architecture-result mismatch only to Gates 3 and 4."
boundaries = [
    { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "_gate_result", before = "Command evidence omitted the exact argument vector executed by the hosted runner.", after = "Strict quality evidence requires one nonempty exact executed argument vector for every command result." },
    { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "_parse_evidence", before = "Quality evidence parsing did not require an immutable test manifest or exact executed argv.", after = "Schema-v5 parsing requires the exact test manifest and one exact executed argv vector per command." },
    { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "_policy_blocks", before = "Evidence policy did not compare the authenticated test manifest with the immutable head tree.", after = "Evidence policy blocks any exact test-manifest mismatch alongside production-manifest mismatch." },
    { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "decision_payload", before = "The deterministic decision payload omitted the exact test manifest.", after = "The deterministic decision payload retains the exact source and test manifests used by fixed command expansion." },
    { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "evidence_blocks", before = "Evidence binding received only the immutable production manifest.", after = "Evidence binding receives and verifies both immutable source and test manifests." },
    { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "provenance_payload", before = "Run provenance retained output and raw-proof hashes but omitted executed argv.", after = "Run provenance carries exact executed argv while the deterministic decision retains the approved immutable template." },
    { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "test_files", before = "The decision payload did not retain the exact immutable-head test manifest used to expand $TEST_FILES.", after = "The schema-v5 decision carries the exact language-specific test manifest recomputed from the immutable head tree." },
    { path = "src/supportability_gate/quality_profile.py", kind = "module", symbol = "src/supportability_gate/quality_profile.py", before = "The quality schema lacked exact argv and test-manifest binding, while fixed Python coverage and TypeScript formatting vectors could inherit target configuration.", after = "Schema v5 binds exact argv and source/test manifests, Python coverage uses a trusted rcfile, and TypeScript formatting ignores target editor configuration." },
    { path = "src/supportability_gate/cli.py", kind = "function", symbol = "_quality_evidence", before = "Source validation recomputed only the production manifest when checking hosted quality evidence.", after = "Source validation recomputes both immutable-head source and test manifests before accepting hosted quality evidence." },
    { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "_write_python_configs", before = "Python quality execution could discover target-owned coverage reporting exclusions.", after = "The runner writes one trusted empty coverage exclusion configuration consumed by measurement and report generation." },
    { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "_write_coverage_config", before = "The generated coverage configuration could be mutated by target tests before trusted report production.", after = "One shared writer restores and verifies exact trusted bytes immediately before coverage JSON production." },
    { path = "src/supportability_gate/quality_runner.py", kind = "module", symbol = "src/supportability_gate/quality_runner.py", before = "Trusted coverage bytes were duplicated or left implicit across measurement and report production.", after = "The module owns one exact byte sequence reused for initial measurement configuration and post-target restoration." },
    { path = "src/supportability_gate/quality_runner.py", kind = "function", symbol = "profile_files", before = "The hosted runner derived test files through local suffix logic not shared with evidence validation.", after = "The hosted runner delegates both exact manifests to the quality-profile contract used by source validation." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_add_quality", before = "Artifact validation received only adapter identities and discarded the authenticated quality decision payload.", after = "Artifact validation receives the retained quality profile needed to reconstruct the exact captured bytes." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_complexity", before = "Aggregate parsing discarded the validated quality profile after deriving adapters and result.", after = "Aggregate parsing retains the validated profile solely for downstream authenticated artifact reconstruction." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_complexity_components", before = "Malformed or contradictory profile semantics either collapsed the complete complexity source or let omitted Gate 3 failure evidence pass.", after = "Malformed quality semantics affect Gates 4 and 7, architecture-result mismatch affects Gates 3 and 4, and other parsed facts remain available." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_profile", before = "A producer could authenticate substituted templates, unreported omitted adapters, or reordered stateful adapters together with matching executed argv.", after = "Aggregate quality decisions require schema v5, the canonical adapter order, each immutable template and proof kind, exact source/test manifests, and an exact missing-command block for every omitted adapter before provenance can bind." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_provenance_adapters", before = "Aggregate provenance validated adapter and proof hashes but no executed vector.", after = "Aggregate provenance requires one nonempty string-only executed vector per ordered adapter." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_quality_command", before = "Aggregate validation did not bind each approved argument template to the exact executed vector.", after = "Aggregate validation consumes every template argument against one exact executed vector with fixed list cardinality." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_quality_paths", before = "Expanded source, test, repository, output, and tools paths were not cross-bound.", after = "Expanded paths must share one repository root, exact manifests, and one output-owned tools directory." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_quality_scalar", before = "Approved scalar placeholders were not checked against consistent executed values.", after = "Each scalar placeholder expands to one nonempty value reused consistently across all commands." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_quality_value", before = "Repeated quality placeholders could not be compared across authenticated commands.", after = "Repeated placeholder values must match exactly across the complete authenticated command set." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_quality_argv", before = "A freshly authenticated executed vector could differ semantically from its approved template or omit/substitute list expansion and still pass Gate 7.", after = "Every authenticated executed vector must be the canonical template plus consistent allowed scalar expansion and exact source/test lists; any extra, omitted, or substituted argument is a Gate-7 technical failure." },
    { path = "src/supportability_gate/standard_block_ownership.py", kind = "module", symbol = "src/supportability_gate/standard_block_ownership.py", before = "The Gate 7 ownership map had no exact test-manifest mismatch code.", after = "QUALITY_TEST_MANIFEST_MISMATCH is owned by Gate 7 with the other deterministic quality-policy failures." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_quality_artifact", before = "External artifact identity was compared without proving the split decision and provenance came from its original bytes.", after = "External artifact identity is accepted only when reconstructed pre-enrichment bytes match the trusted capture hash." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_quality_capture", before = "No aggregate boundary reconstructed the exact quality artifact from split reporting fields.", after = "This boundary ordered-merges decision and provenance commands, restores blank pre-enrichment artifact fields, and hashes exact stable JSON bytes." },
    { path = "src/supportability_gate/standard_results.py", kind = "module", symbol = "src/supportability_gate/standard_results.py", before = "Gate 7 artifact and malformed-profile handling depended on incomplete split evidence.", after = "Gate 7 binds exact reconstructed artifacts and preserves explicit lane dependencies without rereading or executing target code." },
]

[architecture]
dependency_direction = "Dependency flow remains one way: quality_profile defines immutable templates and evidence; quality_runner expands and executes them in the hosted test boundary; reporting splits decision and provenance; standard_results validates and reconstructs the authenticated artifact."
reviewed_paths = [
    ".supportability-characterization.json",
    ".supportability-review.toml",
    "docs/product_completion_contract.md",
    "src/supportability_gate/cli.py",
    "src/supportability_gate/quality_profile.py",
    "src/supportability_gate/quality_runner.py",
    "src/supportability_gate/standard_block_ownership.py",
    "src/supportability_gate/standard_results.py",
    "tests/characterization/gate7-standard-results-boundary.characterization.py",
    "tests/characterization/gate7-standard-results-boundary.golden.json",
    "tests/characterization/standard-results-boundary.characterization.py",
    "tests/hosted_quality_profile.py",
    "tests/test_evaluate_complexity.py",
    "tests/test_quality_profile.py",
    "tests/test_standard_results.py",
]

[responsibility_boundary]
path = "src/supportability_gate/quality_profile.py"
owns = "Fixed Gate 7 command templates, exact immutable-head source/test manifests, strict quality evidence, deterministic decision fields, exact hosted-run provenance, coverage observations, and Gate 7 policy blocks."
does_not_own = "Target application behavior, arbitrary commands, shell execution, package selection, policy waivers, thresholds, exclusions, other Standards, focused review, or organization activation."

[incremental_refactor]
target = "Qualify only Supportability 7 through fixed hosted quality profiles, exact authenticated evidence, deceptive-poison rejection, and explicit lane isolation."
completed_step = "Added restored trusted Python coverage configuration, hostile measurement-time exclusion proof, canonical adapter-order and exact omission/source/test-manifest binding, raw-artifact reconstruction, a real TSX hosted fixture, and quality-versus-architecture lane isolation without a new package or workflow redesign."

[review_handoff]
summary = "S09 qualifies Gate 7 only. The exact frozen source packet completed one serial Focus 1-8 lifecycle. Consolidated adjudication accepted the coverage-poison and authenticated-argv findings in this single remediation and rejected the S08 historical-ledger rewrite as forbidden by S09 scope. Conversation resolution, deterministic-only final-head proof, normal protected merge, and Python/frontend/short-task/poison qualification remain."
remaining_risks = [
    "GitHub-hosted final-head source validation must execute the hostile Python coverage fixture and the real TSX component fixture.",
    "Python and frontend positive canaries plus every required poison and isolation head remain required before S09 completion.",
]

[human_review]
naming = "coverage.ini, _write_coverage_config, executed_arguments, _s02_quality_argv, _s02_quality_capture, and quality_profile state their single evidence responsibilities."
cohesion = "Fixed command decisions, hosted execution, reporting, aggregate reconstruction, and lane ownership remain separate existing modules."
intended_behavior = "Every missing, unexecuted, failed, stale, mismatched, incomplete, or unauthenticated Gate 7 fact blocks deterministically; valid Python and real component evidence passes."
reviewability = "The bounded diff changes five existing production modules and keeps direct trust-boundary regressions beside the existing quality and aggregate suites."
