schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Every review defect blocks only its owning lanes, unaffected lanes keep their valid evidence, malformed nested values fail closed, and failed stages retain their original typed cause and exact run identity."
proof = "The scoped suite covers sparse multi-lane TOML, duplicate keys, bounded nested-type fuzzing, real producer/enforcer subprocesses, cross-run poisoning, failing commands, provisioning errors, timeouts, missing downloads, bounded sanitized logs, evidence classes, and summary isolation."

[characterization]
captured_behavior = "Before S01, sparse review evidence reported only the first defect while unrelated lanes could PASS, malformed affected_standards/status containers raised uncaught TypeError, and failed upstream stages became generic missing artifacts."
proof = "Retained red-first nodes reproduced each failure before production edits; the exact-head suite records 1127 passes and two hosted-only skips, with protected hosted proof required before merge."

[separation_of_concerns]
