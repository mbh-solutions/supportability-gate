schema_version = "1.0"

[behavior]
intended_behavior = "The required Supportability Gate remains non-green until the trusted Codex connector completes review for the exact pull-request head."
proof = "tests/test_codex_review.py::test_trusted_exact_head_submitted_review_passes"

[characterization]
captured_behavior = "Missing, stale, pending, spoofed, malformed, paginated, and unavailable GitHub evidence fail closed; trusted exact-request completion passes."
proof = "tests/test_codex_review.py"

[separation_of_concerns]
before = "The refactor policy could finish before advisory Codex review completed."
after = "codex_review owns exact-head connector evidence while refactor_policy retains refactor authorization and invokes that boundary."

[architecture]
dependency_direction = "refactor_policy depends on the focused codex_review policy; codex_review uses only the Python standard library and imports no Gate policy."
reviewed_paths = [
    "src/supportability_gate/codex_review.py",
    "src/supportability_gate/refactor_policy.py",
]

[responsibility_boundary]
path = "src/supportability_gate/codex_review.py"
owns = "Bounded GitHub evidence reads and trusted exact-head Codex review completion."
does_not_own = "Codex review judgment, deterministic Supportability evaluation, inline-thread resolution, or target execution."

[incremental_refactor]
target = "Close the merge race without restoring the retired semantic-review system."
completed_step = "Added one focused evidence policy to the existing required Gate path with no new service, check, package, or dependency."

[review_handoff]
summary = "Deterministic enforcement now waits for trusted exact-request Codex review completion; native thread resolution still blocks unresolved inline findings."
remaining_risks = [
    "Codex review remains nondeterministic and is not exhaustive assurance.",
    "A clean connector result is proven by its trusted reaction on the exact-head request comment; a findings result is tied to the exact reviewed commit.",
]

[human_review]
naming = "codex_review names its single external evidence responsibility."
cohesion = "Request parsing, authenticated pagination, connector identity, exact-head review, clean reaction, and bounded polling form one policy boundary."
intended_behavior = "The existing Gate waits for connector completion and fails closed on missing, stale, spoofed, malformed, or unavailable evidence."
reviewability = "Eight focused tests cover every acceptance branch without target execution or a new runtime surface."

[[module_boundaries]]
path = "src/supportability_gate/codex_review.py"
owner_path = "src/supportability_gate/codex_review.py"
basis = "responsibility"
justification = "Owns exact-head Codex request and completion evidence from fixed authenticated GitHub endpoints; it does not own refactor policy or review-thread resolution."

[[module_boundaries]]
path = "src/supportability_gate/quality_profile.py"
owner_path = "src/supportability_gate/quality_profile.py"
basis = "responsibility"
justification = "Owns the immutable approved command contract and verification of API-read artifact metadata and exact attestation values, but not plan materialization, generated tool configuration, or target execution."

[[module_boundaries]]
path = "src/supportability_gate/quality_runner.py"
owner_path = "src/supportability_gate/quality_runner.py"
basis = "responsibility"
justification = "Owns materialization of concrete Python and TypeScript command plans from the quality-profile contract and independently defines their immutable tool configuration while the disposable GitHub-hosted job alone executes target code."

[[module_boundaries]]
path = "src/supportability_gate/refactor_policy.py"
owner_path = "src/supportability_gate/refactor_policy.py"
basis = "responsibility"
justification = "Owns deterministic Milestone 8 authorization, boundedness, focus, runnability, and sequence verification without executing target code."

[[module_boundaries]]
path = "src/supportability_gate/characterization.py"
owner_path = "src/supportability_gate/characterization.py"
basis = "responsibility"
justification = "Owns deterministic static verification of authenticated Milestone 7 capture artifacts without executing target code."

[[module_boundaries]]
path = "src/supportability_gate/modularity_policy.py"
owner_path = "src/supportability_gate/modularity_policy.py"
basis = "responsibility"
justification = "Owns deterministic new-location justification, vague-location, coupling-edge, and complete-coverage evidence required by Enforcement Milestone 6."
