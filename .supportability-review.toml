schema_version = "1.0"

[behavior]
intended_behavior = "Project #10 S01 separates advisory Codex connector collection from deterministic evidence ownership, requires eight exact-head and exact-run focuses in strict order with unique trusted completions, permits a same-focus retry only after the deterministic 450-second timeout, rejects review after a successful lifecycle, and reuses that completed lifecycle after remediation."
proof = "tests/test_codex_review.py::{test_eight_serial_focuses_return_distinct_completion_evidence,test_active_focus_cannot_retry_before_timeout,test_timed_out_focus_may_retry_before_success,test_successful_focus_cannot_be_requested_again,test_completed_review_lifecycle_is_reused_after_remediation,test_second_review_after_remediation_blocks}; tests/test_standard_results.py"

[characterization]
captured_behavior = "The Codex review boundary remains read-only and exact-head and exact-run bound; focused_review.py contains only the fixed focus contract and completion evidence types; refactor-policy result production is independent of connector completion; workflow tests bind independent connector and deterministic job results."
proof = "tests/characterization/codex-review-boundary.characterization.py; tests/test_codex_review.py; tests/test_refactor_policy.py::test_refactor_result_is_independent_of_connector_completion; tests/test_standard_results.py; hosted run 32804649766 jobs 97672245305 and 97672245328 passed base and head characterization"

[separation_of_concerns]
before = "codex_review.py owned GitHub transport, the fixed focus contract, connector lifecycle evaluation, and connector evidence types while deterministic refactor evaluation also consumed connector completion state."
after = "focused_review.py owns only the fixed focus contract and connector evidence types; codex_review.py owns read-only GitHub lifecycle collection; refactor_policy.py owns deterministic refactor evaluation without connector input; the workflow binds their separate results."

[architecture]
dependency_direction = "focused_review.py is a dependency-free leaf contract imported by codex_review.py; refactor_policy.py does not import or consume connector state; organization-required.yml consumes separate connector and deterministic result channels."
reviewed_paths = [
    ".supportability-review.toml",
    ".github/workflows/organization-required.yml",
    "src/supportability_gate/codex_review.py",
    "src/supportability_gate/focused_review.py",
    "src/supportability_gate/refactor_policy.py",
]

[responsibility_boundary]
path = "src/supportability_gate/focused_review.py"
owns = "The fixed eight-focus command contract plus immutable request acknowledgement and completion evidence value types shared by connector collection and workflow binding."
does_not_own = "GitHub API access, polling, lifecycle decisions, deterministic refactor policy, workflow orchestration, target repository execution, or connector judgment."

[incremental_refactor]
target = "Complete only Project #10 S01 connector lifecycle separation and eight-focus lifecycle enforcement without starting S02 or changing organization ruleset targets."
completed_step = "One runnable slice extracted the fixed focus contract into focused_review.py, made deterministic refactor results connector-independent, bound separate results in organization-required.yml, and passed the focused connector, refactor, result-binding, and source proof on commit 7b914499034f6a32dde9bac533f86737e5528b1c."

[review_handoff]
summary = "Issue #144 owner-authorizes S01 and PR #156 is the bounded implementation PR that closes it. Changed production boundaries are codex_review.py, focused_review.py, refactor_policy.py, and organization-required.yml, with direct coverage in tests/test_codex_review.py, tests/test_refactor_policy.py, and tests/test_standard_results.py. This handoff does not claim an authenticated refactor-authorization comment, eight live focused reviews, target-repository proof, merge, terminal ledger closure, or S02 activation."
remaining_risks = [
    "No Codex review request has been posted on PR #156, so no live focus acknowledgement or completion is claimed.",
    "Hosted run 32804649766 job 97672378084 reported MISSING_OWNER_AUTHORIZATION, MISSING_RUNNABILITY_COVERAGE, and NON_RUNNABLE_LOGICAL_STEP; this TOML correction records truthful scope and proof but does not fabricate the separate authenticated authorization or characterization-manifest inputs those checks consume.",
    "Required target-repository proof, protected merge, terminal ledger update, and Project transition remain controller-owned and incomplete.",
    "Codex judgment remains probabilistic and non-exhaustive even when eight focused completions are required.",
]

[human_review]
naming = "focused_review names the exact shared contract; codex_review remains the GitHub connector and lifecycle owner; refactor_policy remains the deterministic policy owner."
cohesion = "Each changed production boundary has one named responsibility and focused tests exercise connector sequencing, retry timeout, deterministic independence, and final result binding."
intended_behavior = "Owner-authorized issue #144 limits PR #156 to S01 connector separation and eight-focus lifecycle enforcement; S02 and later milestones, organization ruleset targets, target code import, and target execution remain excluded."
reviewability = "The handoff names exact files, tests, commit, hosted run and job identities, unresolved hosted blocks, and unclaimed delivery evidence so reviewers can distinguish local behavior proof from remaining protected evidence."

[[module_boundaries]]
path = "src/supportability_gate/focused_review.py"
owner_path = "src/supportability_gate/focused_review.py"
basis = "responsibility"
justification = "This new location owns the cohesive, dependency-free eight-focus command contract and immutable connector evidence value types; keeping them outside codex_review.py prevents the GitHub transport and lifecycle module from also owning the shared workflow-facing contract."
