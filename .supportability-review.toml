schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "The fixed related-test mapping remains behaviorally identical in a protected S07 canary."
proof = "Protected characterization compares base and head behavior."

[characterization]
captured_behavior = "The retained v5 obligation covers related_test_matches."
proof = "Base and head captures must remain byte-identical."

[separation_of_concerns]
