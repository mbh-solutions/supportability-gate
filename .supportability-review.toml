schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Preserve the existing refactor lane while adding a repository- and language-agnostic oracle-first correction transaction inside the same eight protected contexts. Only exact declared behavior-change blocks may reconcile after trusted schema-5 authorization; every technical prerequisite and unrelated block remains fail-closed."
proof = "Focused characterization, authorization and standard-result tests cover both supported adapters, canonical delta identity, preserved behavior, a valid frozen oracle, hidden and absent deltas, post-oracle mutation, stale identities and retained block ownership. Existing schema 1-4 suites and characterization goldens remain unchanged."

[characterization]
captured_behavior = "Schemas 1-4 require compatible base/head behavior. Schema 5 retains the raw delta and adds a frozen generic correction declaration whose expected cases, goldens, reviews and source receipts precede production implementation."
proof = "The schema-5 result recomputes the complete observed scenario and obligation delta, verifies exact declared targets, retains twice-run capture and requires head output to match frozen goldens. The refactor boundary verifies Git ancestry, oracle immutability and exact owner binding."

[separation_of_concerns]
before = "The characterization and refactor pipelines could prove behavior preservation and API birth but had no authenticated representation for an intentional correction to existing behavior."
after = "Characterization owns generic declaration parsing and observed-delta evidence; refactor policy owns Git transaction and owner-authorization identity; the result composer independently joins and classifies the authenticated outcome."
