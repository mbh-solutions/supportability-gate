schema_version = "1.0"

[behavior]
intended_behavior = "Supportability 6 blocks every applicable refactor unless one trusted owner comment exactly binds repository, base, head, complete scope, exact source-derived responsibility targets, truthful breadth, immediate predecessor sequence, and authenticated runnable Gate 5 evidence. Valid bounded Python and TypeScript or TSX increments pass; every Gate 6 failure remains isolated to Gate 6."
proof = "tests/test_refactor_policy.py; tests/test_standard_results.py; tests/test_characterization.py::test_separate_scenarios_cover_one_runnable_logical_step; tests/test_evaluate_complexity.py::{test_standard_hash_change_fails_source_validation,test_unresolved_typescript_alias_blocks_gate_three_through_real_evaluator,test_real_indexed_boundary_poison_blocks_only_gate_two_after_aggregation}"

[characterization]
captured_behavior = "The version-aware Gate 6 standard-results canary proves the exact pre-S08 protected base and S08 head produce identical behavior while both sides execute the Gate 6 producer on fixed authenticated evidence and the head executes exact Python plus TypeScript target derivation. Direct tests cover exact target identity, deletion, rename, frontend declarators, runnability, all fifteen Gate 6 families, finite GitHub evidence retrieval, and target-derivation isolation in both Gate 5 characterization and aggregate evidence collection."
proof = ".supportability-characterization.json; tests/characterization/gate6-standard-results-boundary.characterization.py; tests/characterization/gate6-standard-results-boundary.golden.json; tests/test_characterization.py::{test_logical_step_runnability_requires_same_recorded_command,test_target_derivation_failure_preserves_characterization}; tests/test_evaluate_complexity.py::{test_refactor_target_derivation_failure_preserves_other_evidence,test_typescript_declarator_only_change_does_not_touch_gate_one_function}; tests/test_refactor_policy.py; tests/test_standard_results.py"

