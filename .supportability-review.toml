  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_valid_obligation_target", before = "Obligations had no scenario-bound target validation.", after = "Behavior and CLI targets must be covered paths while static targets name their scenario." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_verification_result", before = "Verification results exposed scenario evidence only.", after = "Verification results carry stable obligation rows and obligation coverage." },
