schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Reject runtime-created target code omitted from the schema-4 source inventory, while preserving declared function traces, exact class/module scaffolding and trusted standard-library dataclass generation."
proof = "Real collector regressions reproduce same-file and foreign-filename generation, aliased creation, caught errors and precreated injected functions; existing typed and class-helper positives remain passing. Native hosted collector controls exercise same-file and alternate-filename runtime code."

[characterization]
captured_behavior = "Before the repair, nine adversarial collector cases failed their literal expected rejection assertions. Existing normal and exception oracles, the named-body execution metric, and all historical characterization assets remain unchanged."
proof = "The same regressions must reject after the observer repair. The full source suite and protected base/head characterization preserve ordinary API, typed dataclass, class-helper, capacity and owner-authorization behavior."

[separation_of_concerns]
before = "The module observer silently skips any code absent from the named function inventory, and skips foreign filenames even when runtime code belongs to the observed module."
after = "The existing observer owns runtime provenance and fail-closed capture. Static inventory, root oracles, authorization, capacity and Standard composition retain their existing responsibilities."
boundaries = []

[architecture]
dependency_direction = "Keep target execution and audit hooks in the fixed isolated collector. Static production policy still does not import or execute target modules; no new production dependency or policy engine is introduced."
reviewed_paths = [".supportability-review.toml", "tests/module_characterization_observer.py", "tests/test_module_observation.py", "tests/test_module_introduction.py", "docs/product/Repository-Configuration.md"]

[responsibility_boundary]
path = "tests/module_characterization_observer.py"
owns = "Fixed schema-4 hosted collection of inventory-bound target calls, root outcomes, body line witnesses and runtime-code refusal."
does_not_own = "Static acceptance policy, semantic truth, branch completeness, imported dependency inventories, owner authority, scope enrollment or promotion."

[incremental_refactor]
target = "Repair the runtime-code inventory omission independently identified in PR 276, without rolling back evidence capacity or PR 278."
completed_step = "Add observer-owned runtime provenance checks, meaningful collector and native hosted regressions, and precise same-file assurance documentation."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Frame ownership, unaccounted code and declared dataclass factory name concrete execution-boundary responsibilities."
cohesion = "Runtime checks remain with the module observer; collector regression fixtures and native sandbox controls remain in existing test owners."
intended_behavior = "Unsupported runtime-created target code fails capture even if the target catches the error; supported static bodies and generated dataclass methods retain their existing proof."
reviewability = "A bounded five-file change, recorded pre-fix failures, literal regression outcomes, preserved historical oracles and final-head source/hosted evidence support independent review."
