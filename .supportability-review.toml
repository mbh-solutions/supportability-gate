schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Verify each side of a schema-5 module correction against that side's frozen root oracle. A changed head oracle cannot invalidate authentic protected-base execution, and neither side may validate against the other's expected cases."
proof = "A focused unit test supplies distinct frozen base and head root oracles, proves each capture receives only its matching oracle, and proves the verification-only base oracle is absent from serialized evidence. The existing schema-5 correction tests and Ruff checks pass."

[characterization]
captured_behavior = "Existing unchanged module characterizations still use the same head oracle on both sides because the base and head bytes are identical. A correction with different frozen cases now reads the protected-base module golden for base verification and the oracle-commit golden for head verification."
proof = "The test exercises both verifier calls with different case sets and checks that public result serialization remains schema-compatible. Missing or malformed base oracle files still fail closed through the existing Git and oracle parsers."

[separation_of_concerns]
before = "Module API verification compared both protected-base and corrected-head captures to the head module golden, so a legitimate oracle-first correction made authentic base execution appear missing."
after = "Module API verification loads both immutable Git objects and checks each capture against its own side's root oracle, while serializing only the existing public module evidence shape."
boundaries = [
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_module_binding", before = "Only the head module golden was loaded for API verification.", after = "The protected-base and corrected-head module goldens are loaded independently; a missing base blob is allowed only for a genuinely absent base scenario." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_module_oracle_cases", before = "Module-oracle loading and validation were embedded in the binding function.", after = "One bounded reader validates the fixed case count and permits a missing blob only when the caller explicitly identifies an absent base scenario." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_module_capture_matches", before = "Both sides were checked against the head root cases.", after = "Base uses frozen base root cases and head uses frozen head root cases; all inventory, source, execution and determinism checks remain unchanged." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_serialized_api_facts", before = "Every internal module-binding field was spread into result evidence.", after = "Verification-only private fields are removed so the public result schema and retained evidence remain byte-compatible." },
]

[architecture]
dependency_direction = "The existing direction is preserved: characterization depends only on contract and Git facts; refactor policy consumes characterization evidence; standard results independently validates both; the producer and publisher remain above the deterministic decision layer."
reviewed_paths = [".supportability-review.toml", "src/supportability_gate/characterization.py", "tests/test_characterization.py"]

[responsibility_boundary]
path = "src/supportability_gate/characterization.py"
owns = "Generic correction declarations, side-specific frozen module oracles, authenticated base/head observations, canonical behavior deltas and frozen-oracle evidence identities."
does_not_own = "Trusted-owner authentication, GitHub comments, quality execution, handoff evidence or semantic truth of source receipts."

[incremental_refactor]
target = "Make oracle-first module corrections prove complete API execution on both sides without comparing the base to corrected expectations."
completed_step = "Bind base execution to the protected-base module golden and head execution to the corrected golden, then strip the private verifier input from public evidence."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Correction, oracle, observed delta and result-classification names describe exact policy facts rather than domain interpretation."
cohesion = "Parsing and observation remain in characterization, authentication remains in refactor policy, and independent aggregate validation remains in standard results."
intended_behavior = "Ordinary refactors remain behavior-preserving. A schema-5 module correction must execute both sides against their independently frozen cases; it cannot satisfy base execution with head expectations."
reviewability = "The change is limited to module-oracle loading, side selection, result serialization, one focused regression test and this evidence update; workflow contexts, thresholds and bypass policy are unchanged."
