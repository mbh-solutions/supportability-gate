schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Provision locked Node characterization prerequisites outside isolated execution and require quality runtime coverage only for head responsibilities."
proof = "Focused revision-mapping regressions, dependency integrity and configuration controls, hosted read-only and network denial probe, and complete source validation."

[characterization]
captured_behavior = "Existing capture protocols and goldens remain unchanged. Deleted base responsibilities stay in review and authorization targets while surviving bodies retain runtime obligations."
