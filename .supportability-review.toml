schema_version = "1.0"
module_boundaries = [
  { path = "tests/source_integrity_check.py", owner_path = "tests/source_integrity_check.py", basis = "responsibility", justification = "Owns independently pinned static receipts, source-control validation, sandboxed conformance orchestration, and its authenticated result." },
  { path = "tests/source_integrity_conformance.py", owner_path = "tests/source_integrity_conformance.py", basis = "responsibility", justification = "Owns the trusted positive, policy-negative, and malformed-input cases executed against candidate validator code." },
]

[behavior]
intended_behavior = "A source-only pinned workflow independently authenticates immutable inputs and required controls, validates the canonical clause registry with trusted code, and executes trusted conformance against candidate validator code only inside the S02 sandbox."
proof = "Local tests cover current source, workflow replacement, immutable tamper, clean trusted cases, and candidate-validator weakening; protected canaries exercise PASS, policy BLOCK, technical failure, and pinned-fixture independence."

[characterization]
captured_behavior = "Before S03, a coordinated candidate replaced Source Validation with success, removed the Standard negative test, weakened the inventory validator, and changed the Standard; the candidate-controlled check passed while pinned Gate lanes blocked."
proof = "Never-merge baseline PR #230 retains exact head, candidate Source Validation run, pinned organization run, named policy blocks, and artifact digests."

[separation_of_concerns]
before = "Source Validation and its tests came from the candidate branch; coordinated edits could make its required context report success even though other Gate defenses might still block."
after = "A source-only workflow comes from an exact protected pin, owns its manifest and conformance fixture, authenticates candidate bytes, and imports candidate validator code only in S02 isolation."
boundaries = [
]

[architecture]
dependency_direction = "The source-integrity orchestrator depends inward on the existing clause validator and S02 sandbox constructor; the trusted fixture is mounted read-only and candidate code cannot own the host collector or authoritative output."
reviewed_paths = [".github/workflows/source-integrity.yml", ".supportability-review.toml", "docs/enforcement_matrix.md", "docs/source_integrity_manifest.json", "tests/source_integrity_check.py", "tests/source_integrity_conformance.py", "tests/test_source_integrity.py"]

[responsibility_boundary]
path = "tests/source_integrity_check.py"
owns = "Pinned source-input authentication, trusted source-control checks, isolated conformance orchestration, and exact result identity."
does_not_own = "The eight consumer policy lanes, semantic review, candidate workflow execution, ruleset administration, or successor remediation."

[incremental_refactor]
target = "Protect essential Gate source qualification independently from candidate-controlled workflows and tests without adding another policy engine."
completed_step = "Added one pinned source-only guard with immutable receipts, current-control validation, trusted clause conformance in the existing S02 sandbox, and authenticated evidence output."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Trusted root, candidate repository, manifest, receipts, conformance, and source identity distinguish every authority boundary."
cohesion = "The new production module owns source integrity only; the fixture owns cases; the workflow owns transport; the existing validator and S02 sandbox keep their original responsibilities."
intended_behavior = "Candidate workflow/test coordination cannot supply the required Source Integrity result, alter immutable bytes, weaken canonical mapping, or execute candidate validator code outside isolation."
reviewability = "The manifest names protected inputs and pins; result JSON binds exact identities and receipts; focused tests reproduce success, workflow replacement, tamper, and weakened-validator outcomes."
