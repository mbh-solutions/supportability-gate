schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Resume exact-change owner authorization over immutable captures correct TypeScript runtime coverage attribution, and reduce redundant waiting without weakening proof."
proof = "Authorization wait, stale identity, wrong source workflow, artifact tampering, event ordering and check identity regressions; hosted continuation qualification and complete source validation."

[characterization]
captured_behavior = "Successful characterization protocols and goldens remain unchanged; failed execution is not repeated and is reported after evidence retention. Hosted import-only and real-call controls distinguish original TypeScript body execution from transformed-file line artifacts."
proof = "tests/test_consumer_runtime_contract.py plus existing characterization and quality suites."

[separation_of_concerns]
before = "The publisher completed authorization-dependent checks as failures and comments did not resume evaluation."
after = "The publisher distinguishes an authorization wait; a read-only supervisor reuses source-bound evidence, while a separate publisher updates original checks after freshness validation."
boundaries = [{ path = "src/supportability_gate/quality_profile.py", kind = "module", symbol = "src/supportability_gate/quality_profile.py", before = "The fixed Node coverage command omitted source-map interpretation for transformed TypeScript.", after = "The fixed command enables source maps so runtime observations refer to original TypeScript body lines." }]

[architecture]
dependency_direction = "Hosted orchestration depends on the existing deterministic composer, bundle validator and refactor policy. These production modules do not depend on orchestration."
reviewed_paths = ["tests/hosted_authorization_evidence.py", "tests/hosted_authorization_resume.py", "tests/hosted_check_publisher.py", "src/supportability_gate/quality_profile.py"]

[responsibility_boundary]
path = "tests/hosted_authorization_resume.py"
owns = "Authenticated event-driven continuation of owner authorization over retained evidence."
does_not_own = "Consumer execution, policy definitions, fabricated owner authority or bypassing required checks."

[incremental_refactor]
target = "Remove the owner authorization failure-and-rerun cycle while preserving exact-change enforcement."
completed_step = "Add an explicit pending presentation and a pinned reusable continuation with a minimal event receiver."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Evidence eligibility, authorization evaluation and check publication have separate named responsibilities."
cohesion = "New hosted modules own authorization continuation; the existing fixed quality profile owns the source-map execution option."
intended_behavior = "Missing authorization waits; valid owner evidence resumes the original checks; technical failures, stale identities and invalid grants remain blocking."
reviewability = "Pinned shared receiver, isolated privilege boundaries, focused hostile-input regressions and source validation; immutable Standard and owner policy remain unchanged; the fixed Node command corrects observed-line attribution."
