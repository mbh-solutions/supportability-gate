boundaries = []

[architecture]
dependency_direction = "Production package dependencies remain unchanged; hosted characterization reuses the trusted quality collector's installed dependency authentication."
reviewed_paths = ["tests/hosted_characterization.py", "tests/hosted_quality_profile.py"]

[responsibility_boundary]
path = "tests/hosted_characterization.py"
owns = "Trusted hosted capture orchestration and fixed prerequisite provisioning."
does_not_own = "Consumer behavior, policy thresholds, owner authentication or merge enforcement."

[incremental_refactor]
target = "Correct shared consumer runtime preparation and revision binding."
completed_step = "Add locked Node preparation and head-bound quality targets without changing review targets or isolation controls."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Prerequisite provisioning and head runtime target selection have explicit responsibility names."
cohesion = "Changes remain in their existing hosted capture and quality collectors."
intended_behavior = "Legitimate locked consumers can execute inside isolation; missing body coverage and failed scenarios remain blocking."
