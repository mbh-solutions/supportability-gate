schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Owner task authorization is separate from technical proof. Current hosted runs require no owner comment; exact source, coverage, runtime, frozen correction history and all eight checks remain enforced."
proof = "Direct no-comment Python and TypeScript fixtures, correction history tamper regressions, consumer composition checks, preserved legacy evidence tests and hosted protected qualification."

[characterization]
captured_behavior = "Existing characterization definitions and legacy evidence outputs remain preserved. The hosted entry now emits measured work evidence without owner attestation fields."
proof = "tests/test_refactor_policy.py and tests/test_standard_results.py exercise new work evidence and retained technical enforcement; existing fixed characterization scenarios remain authoritative."

[separation_of_concerns]
before = "Owner comments mixed work authorization with machine-derived scope and claimed review evidence."
after = "The existing scope module derives source-bound proof; the final composer independently reconciles it; reporting never infers an owner attestation from a passing check."
boundaries = []

[architecture]
dependency_direction = "Hosted orchestration depends on the existing deterministic composer, bundle validator and refactor policy. These production modules do not depend on orchestration."
reviewed_paths = ["src/supportability_gate/refactor_policy.py", "src/supportability_gate/reporting.py", "src/supportability_gate/standard_results.py"]

[responsibility_boundary]
path = "src/supportability_gate/refactor_policy.py"
owns = "Git-derived runnable work scope and frozen correction history, with compatibility readers for historical evidence."
does_not_own = "Task permission, human code review, consumer execution or waiver of another Standard."

[incremental_refactor]
target = "Remove the owner authorization failure-and-rerun cycle while preserving exact-change enforcement."
completed_step = "Remove owner-comment enforcement from current hosted evaluation and retire the receiver, while preserving technical checks and historical evidence."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Work evidence, correction history, consumer reconciliation and legacy authorization have explicit names."
cohesion = "No new production module. Existing scope, reporting and composition modules retain their responsibilities."
intended_behavior = "No approval ritual. Stale technical evidence, runtime and coverage gaps, changed frozen expectations and unsupported scope still block."
reviewability = "Author declaration only, not owner technical review. Immutable Standard, roadmap, source guard, isolated execution and strict protected delivery remain unchanged."
