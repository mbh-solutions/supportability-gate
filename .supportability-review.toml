schema_version = "1.0"

[behavior]
intended_behavior = "The supported package exposes only supportability-gate and enforces deterministic policy plus required structured author evidence."
proof = "tests/test_evaluate_complexity.py::test_valid_milestone_three_evidence_passes_and_reports_judgment"

[characterization]
captured_behavior = "Semantic-only scenarios are removed while retained Gate, quality, clause-inventory, architecture, modularity, and package scenarios remain."
proof = "tests/test_characterization.py::test_deleted_source_uses_retained_characterization_only"

[separation_of_concerns]
before = "A second package entry point owned model transport, GitHub App publication, review events, replay, diagnostics, and model verdict parsing."
after = "Only the deterministic Gate entry point remains; machine and App resource cleanup stays isolated to S04."

[architecture]
dependency_direction = "The retained package follows the existing deterministic Gate layers; the disconnected semantic dependency graph is removed."
reviewed_paths = [
    "src/supportability_gate/github_app.py",
    "src/supportability_gate/handoff_policy.py",
    "src/supportability_gate/responses_transport.py",
    "src/supportability_gate/review_events.py",
    "src/supportability_gate/review_state.py",
    "src/supportability_gate/semantic_cli.py",
    "src/supportability_gate/semantic_contract.py",
    "src/supportability_gate/semantic_diagnostics.py",
    "src/supportability_gate/semantic_review.py",
    "src/supportability_gate/clause_inventory.py",
    "src/supportability_gate/review_evidence.py",
]

[responsibility_boundary]
path = "src/supportability_gate/clause_inventory.py"
owns = "Immutable Standard clause traceability to retained deterministic blocking tests."
does_not_own = "Independent qualitative truth judgment, model review, machine cleanup, or target execution."

[incremental_refactor]
target = "Retire custom semantic source without weakening deterministic enforcement."
completed_step = "Removed semantic-only source, entry point, tests, qualification paths, and stale mappings while retaining structured review validation."

[review_handoff]
summary = "Deterministic enforcement and author-provided qualitative review evidence passed; no independent or exhaustive semantic assurance is claimed."
remaining_risks = [
    "Author-provided qualitative evidence is structurally validated, but its prose truth is not mechanically established.",
    "Disabled tasks, App, key, runtimes, and diagnostics remain for S04.",
]

[human_review]
naming = "The retained supportability-gate name identifies the sole supported deterministic enforcement entry point."
cohesion = "Semantic transport, orchestration, publication, replay, and verdict parsing leave together as one disconnected capability island."
intended_behavior = "Deterministic policy and required structured author evidence remain; custom model judgment is retired."
reviewability = "The source graph, manifest, blocking-test pointers, package metadata, and fresh wheel provide direct bounded proof."

[[module_boundaries]]
path = "src/supportability_gate/quality_profile.py"
owner_path = "src/supportability_gate/quality_profile.py"
basis = "responsibility"
justification = "Owns the immutable approved command contract and verification of API-read artifact metadata and exact attestation values, but not plan materialization, generated tool configuration, or target execution."

[[module_boundaries]]
path = "src/supportability_gate/quality_runner.py"
owner_path = "src/supportability_gate/quality_runner.py"
basis = "responsibility"
justification = "Owns materialization of concrete Python and TypeScript command plans from the quality-profile contract and independently defines their immutable tool configuration while the disposable GitHub-hosted job alone executes target code."

[[module_boundaries]]
path = "src/supportability_gate/refactor_policy.py"
owner_path = "src/supportability_gate/refactor_policy.py"
basis = "responsibility"
justification = "Owns deterministic Milestone 8 authorization, boundedness, focus, runnability, and sequence verification without executing target code."

[[module_boundaries]]
path = "src/supportability_gate/characterization.py"
owner_path = "src/supportability_gate/characterization.py"
basis = "responsibility"
justification = "Owns deterministic static verification of authenticated Milestone 7 capture artifacts without executing target code."

[[module_boundaries]]
path = "src/supportability_gate/modularity_policy.py"
owner_path = "src/supportability_gate/modularity_policy.py"
basis = "responsibility"
justification = "Owns deterministic new-location justification, vague-location, coupling-edge, and complete-coverage evidence required by Enforcement Milestone 6."
