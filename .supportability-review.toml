[architecture]
dependency_direction = "Preserved: analyzers, profile validation and the composer consume the lower-level contract source classification. Asset parsing uses only the standard library and never executes target scripts."
reviewed_paths = ["src/supportability_gate/architecture_policy.py", "src/supportability_gate/characterization.py", "src/supportability_gate/cli.py", "src/supportability_gate/contract.py", "src/supportability_gate/function_changes.py", "src/supportability_gate/gate_policy.py", "src/supportability_gate/quality_profile.py", "src/supportability_gate/refactor_targets.py", "src/supportability_gate/standard_results.py"]

[responsibility_boundary]
path = "src/supportability_gate/quality_profile.py"
owns = "Fixed source eligibility and exact-byte quality receipts, including structural validation of supported browser assets and in-scope external-script references."
does_not_own = "Application business behavior, browser rendering, semantic content correctness, owner acceptance, deployment approval or waivers."

[incremental_refactor]
target = "Repair inconsistent browser source admission and bounded asset/scenario capability gaps."
completed_step = "Unify existing source classifiers, retain frontend enforcement and add fail-closed browser asset receipts under protected correction evidence."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Source suffixes, HTML parser and icon-entry validation name their concrete responsibilities."
cohesion = "Contract classification remains lower-level; existing quality receipts retain asset validation. No consumer-specific behavior, new service or policy engine is introduced."
intended_behavior = "JavaScript remains production code. Inline executable HTML and unsupported icon encodings block. Observed API introduction remains Python-specific; ordinary Node scenarios and owner-authorized correction evidence are distinct."
reviewability = "One bounded capability correction with frozen oracle-first evidence, focused failures reproduced before repair, retained negative controls and exact protected final-head checks."
