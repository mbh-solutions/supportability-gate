schema_version = "1.0"

[behavior]
intended_behavior = "The protected Gate evaluates one repository containing Python and TypeScript production source outside src while authenticating CSS."
proof = "tests/mixed_canary.test.ts and the existing Python proof run through the fixed mixed profile; web/mixed_canary.css is valid UTF-8."

[characterization]
captured_behavior = "One stable TypeScript and CSS scenario runs beside the retained Python scenarios."
proof = "tests/characterization/s13-mixed-stack-canary.characterization.mjs"

[separation_of_concerns]
before = "The protected canary exercised only Python production source."
after = "One temporary TypeScript function and inert stylesheet prove both fixed profiles across declared roots."

[[separation_of_concerns.boundaries]]
path = "web/mixed_canary.ts"
kind = "function"
symbol = "mixedStackLabel"
before = "No TypeScript production responsibility existed in the canary."
after = "The temporary function owns one TypeScript runtime label."

[architecture]
dependency_direction = "The TypeScript canary is dependency-free; existing Python package boundaries remain unchanged."
reviewed_paths = ["web/mixed_canary.ts"]

[responsibility_boundary]
path = "web/mixed_canary.ts"
owns = "One temporary TypeScript runtime label used for protected mixed-profile proof."
