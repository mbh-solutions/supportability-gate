[architecture]
dependency_direction = "No new production module or dependency layer. The collector remains a fixed hosted tests-boundary script. Static characterization compiles source without importing it; the existing result layer consumes refactor policy."
reviewed_paths = [".supportability-characterization.json", ".supportability-review.toml", "docs/product/Boundaries-and-Limitations.md", "docs/product/Eight-Gates.md", "docs/product/Evidence-Model.md", "docs/product/Refactor-Authorization.md", "docs/product/Repository-Configuration.md", "src/supportability_gate/characterization.py", "src/supportability_gate/refactor_policy.py", "src/supportability_gate/standard_block_ownership.py", "src/supportability_gate/standard_results.py", "tests/characterization/gate-api-proof-legacy-compatibility.characterization.py", "tests/characterization/gate-api-proof-legacy-compatibility.golden.json", "tests/characterization_observer.py", "tests/hosted_characterization.py", "tests/test_characterization_observer.py", "tests/test_introduced_characterization.py"]

[responsibility_boundary]
path = "src/supportability_gate/characterization.py"
owns = "Deterministic source-bound characterization compatibility, actual observed behavior, protected intended oracle identities, and required obligation coverage."
does_not_own = "Qualitative semantic judgment, owner authentication, organization adoption, thresholds, deployment, broker execution, or source waiver."

[incremental_refactor]
target = "Issue 272 bounded necessary introduced-behavior proof defect: parser, fixed collector, verifier, existing owner scope policy, and shared Gate 5/6 consumer."
completed_step = "Prepare explicit schema-3 observed API proof while preserving legacy protocol/goldens, immutable Standard and roadmap, source protection, and native required delivery checks."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "API, source, oracle, introduction, and owner grant names identify their explicit responsibilities and do not imply semantic certification."
cohesion = "Only the necessary characterization defect and its existing Gate 5/6 trust joins change; no new production layer or policy engine."
intended_behavior = "A precise genuinely new Python feature can qualify without forged baseline behavior, while every existing covered responsibility retains compatibility."
reviewability = "Fixed protocol versioning, closed JSON/TOML shapes, source-derived facts, retained legacy proof, focused adversarial controls, product boundary documentation, and independent exact-revision technical review make this bounded change inspectable."
