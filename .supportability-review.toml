[incremental_refactor]
target = "Prove the fixed Python-plus-TypeScript profile across declared production roots."
completed_step = "Added one dependency-free TypeScript production function and one valid CSS asset outside src."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "mixedStackLabel names the single canary responsibility."
cohesion = "The temporary module owns only the TypeScript canary label."
intended_behavior = "Both fixed language profiles run in the same protected evaluation and CSS authenticates."
reviewability = "One production function, one direct test, one inert asset, and one characterization scenario."

[[module_boundaries]]
path = "web/mixed_canary.ts"
owner_path = "web/mixed_canary.ts"
basis = "responsibility"
justification = "The dependency-free temporary module is self-owned and exists only for the mixed-profile canary."
