[architecture]
dependency_direction = "Contract selects profiles; CLI orchestrates existing analyzers; quality runner executes fixed commands; result binding consumes authenticated evidence. No new cycle or target-code import."
reviewed_paths = ["src/supportability_gate/characterization.py", "src/supportability_gate/cli.py", "src/supportability_gate/contract.py", "src/supportability_gate/gate_policy.py", "src/supportability_gate/modularity_policy.py", "src/supportability_gate/quality_profile.py", "src/supportability_gate/quality_runner.py", "src/supportability_gate/refactor_targets.py", "src/supportability_gate/standard_block_ownership.py", "src/supportability_gate/standard_results.py"]

[responsibility_boundary]
path = "src/supportability_gate/contract.py"
owns = "Canonical single-language and mixed-language contract identity."
does_not_own = "Command execution, parsing, analysis, or publication."

[incremental_refactor]
target = "Add canonical Python-plus-TypeScript support without a generic adapter platform."
completed_step = "Reused both fixed profiles, partitioned inputs, and bound one result."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Mixed names only the exact union; helpers name owned classification or coverage."
cohesion = "Existing contract, orchestration, planning, and binding owners remain separate."
intended_behavior = "Schema 1.0 stays single-language; schema 1.1 permits only both supported profiles."
reviewability = "One bounded compatibility slice; no package, dependency, command, waiver, or threshold added."
