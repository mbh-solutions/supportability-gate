schema_version = "1.0"
module_boundaries = [
  { path = "src/supportability_gate/characterization.py", owner_path = "src/supportability_gate/characterization.py", basis = "responsibility", justification = "Owns stable behavioral obligations, explicit baseline migrations, capture comparison, and authenticated characterization coverage." },
  { path = "src/supportability_gate/quality_profile.py", owner_path = "src/supportability_gate/quality_profile.py", basis = "responsibility", justification = "Owns fixed quality evidence parsing and proof that required responsibility bodies executed." },
  { path = "src/supportability_gate/refactor_policy.py", owner_path = "src/supportability_gate/refactor_policy.py", basis = "responsibility", justification = "Owns strict runnability consumption of authenticated characterization results across the v1-to-v2 transition." },
  { path = "src/supportability_gate/standard_results.py", owner_path = "src/supportability_gate/standard_results.py", basis = "responsibility", justification = "Owns independent reconstruction of characterization evidence against authenticated responsibility targets." },
]

[behavior]
intended_behavior = "A required behavior cannot disappear behind a renamed scenario, constant output, import-only coverage, or an unbound result. Stable obligations retain exact baseline assertions unless an explicit digest-bound migration is declared; changed responsibility bodies must execute under the fixed quality command."
proof = "Retained RED regressions cover constant-output substitution, obligation removal, scenario rename, incorrect migration digest, import-only Python execution, incomplete Python data, malformed LCOV, targeted Python bodies, one-line bodies, and exact Standard-result recomposition."

[characterization]
captured_behavior = "Before S05, a scenario could retain a matching golden while no longer proving meaningful input-to-output behavior, and importing a file could count as runtime proof even when its changed responsibility body never executed."
proof = "Focused repository fixtures record multiple distinct inputs and outputs, stable scenario-independent obligation IDs, exact transition digests, constant-output rejection, and body-level runtime proof; live manifest activation follows only after this compatibility layer is protected and deployed."

[separation_of_concerns]
before = "Scenario identity, golden equality, coarse file coverage, and module-import execution were treated as sufficient proxies for retained behavior."
after = "Characterization owns stable obligations and migrations, quality_profile owns required-body execution proof, and standard_results binds both to independently derived responsibility targets."
boundaries = [
  { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "_python_runtime_observed", before = "Any executed line in a module counted as runtime proof, then the first S05 deployment also demanded trace events for compiler-only lines.", after = "Every required executable responsibility span must contain an executed body line while compiler-only lines that coverage does not classify as statements are not fabricated runtime duties." },
  { path = "src/supportability_gate/quality_profile.py", kind = "function", symbol = "_runtime_lines", before = "Coverage line lists were validated only as one executed-line collection.", after = "Executed and missing coverage statements share one strict typed and canonical line-list boundary." },
]

[architecture]
dependency_direction = "The hosted adapter derives targets from immutable Git source, characterization owns obligation evidence, quality_profile proves required-body execution from fixed command artifacts, and standard_results independently recomposes the decision without executing target code."
reviewed_paths = [".supportability-review.toml", "src/supportability_gate/characterization.py", "src/supportability_gate/quality_profile.py", "src/supportability_gate/refactor_policy.py", "src/supportability_gate/standard_results.py", "tests/hosted_quality_profile.py", "tests/test_characterization.py", "tests/test_evaluate_complexity.py", "tests/test_quality_profile.py", "tests/test_refactor_policy.py", "tests/test_standard_results.py"]

[responsibility_boundary]
path = "src/supportability_gate/characterization.py"
owns = "Stable behavioral obligations, exact assertion retention, explicit digest-bound migration, and authenticated characterization coverage."
does_not_own = "Semantic review, target execution, command or threshold changes, waivers, protected transport, or successor remediation."

[incremental_refactor]
target = "Require meaningful retained behavior and executed changed responsibility bodies without changing fixed commands or adding a second policy engine."
completed_step = "Added stable obligations, exact migrations, meaningful case validation, target-bound runtime coverage, and independent result binding within existing Gate 5 and Gate 7 ownership."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Obligation, selector, transition, required target, executed line, and meaningful cases expose the deterministic decision inputs."
cohesion = "Manifest and capture meaning stay in characterization, runtime proof stays in quality_profile, and authenticated recomposition stays in standard_results."
intended_behavior = "A retained responsibility must keep meaningful input-to-output evidence and execute under the fixed quality command; exact declared migrations remain possible and auditable."
reviewability = "Focused positive and adversarial regressions expose exact obligation IDs, assertion digests, transition identities, executable versus compiler-only responsibility lines, executed lines, and terminal block or technical-error codes."
