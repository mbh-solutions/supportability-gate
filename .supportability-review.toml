schema_version = "1.0"

[behavior]
intended_behavior = "Project #10 S03 makes Gate 1 deterministically qualify touched Python and TypeScript/TSX functions at maximum 10, preserve progressive legacy improvement, and own ordinary complexity policy failures without creating derivative Gate 4 or Gate 7 failures. Exact changed paths, qualified function identities, metrics, decisions, and applicable Ruff evidence must cross-bind or fail closed."
proof = "tests/test_evaluate_complexity.py::{test_new_complexity_10_passes,test_new_complexity_11_blocks,test_decorated_python_complexity_binds_ruff_to_definition_line,test_legacy_14_to_12_passes_progressively,test_typescript_clean_complexity_10_passes,test_typescript_complexity_11_blocks,test_typescript_metric_matches_eslint_classic_function_constructs,test_complexity_poison_is_byte_identical}; tests/test_standard_results.py::{test_complexity_policy_exit_blocks_gate_one_only,test_progressive_complexity_policy_exit_remains_a_successful_capture,test_function_evidence_must_cross_bind_to_changed_paths_and_ruff,test_ruff_evidence_must_bind_to_touched_function,test_standard_results_import_does_not_require_analysis_dependencies}"

[characterization]
captured_behavior = "Existing gate-cli, quality-profile, architecture-modularity, and standard-results-boundary scenarios cover every changed production responsibility. Focused fixtures add valid and poisoned Python/TypeScript metrics, decorated Ruff mapping, byte identity, Gate 1-only isolation, progressive capture, exact result binding, and the minimal aggregate import boundary."
proof = ".supportability-characterization.json scenarios gate-cli, m9-quality-profile, architecture-modularity-baseline, and standard-results-boundary; tests/test_evaluate_complexity.py; tests/test_standard_results.py"

[separation_of_concerns]
before = "Ordinary complexity-adapter exit 1 was classified as a quality failure, new-location coverage rejected the same authenticated execution, TypeScript function metrics omitted approved classic constructs, decorated Ruff locations used decorator spans, and aggregate function/Ruff collections were independently valid but not cross-bound."
after = "The leaf contract owns ordinary command-failure classification; quality and modularity consumers reuse it; changed-function collection and complexity measurement remain separate; reporting emits only already-verified touched Ruff rows; and standard-results composition cross-binds exact changed sides, names, spans, metrics, messages, decisions, and policy ownership."

[architecture]
dependency_direction = "The dependency-free contract leaf owns fixed adapter identities and command-failure classification. Quality and modularity analysis depend downward on it. The minimal standard-results producer imports standard_results, which now depends only on leaf contract, clause inventory, and block ownership rather than hosted analyzers or tree-sitter packages."
reviewed_paths = [
    ".supportability-review.toml",
    "docs/product_completion_contract.md",
    "src/supportability_gate/complexity_metrics.py",
    "src/supportability_gate/contract.py",
    "src/supportability_gate/function_changes.py",
    "src/supportability_gate/modularity_policy.py",
    "src/supportability_gate/quality_profile.py",
    "src/supportability_gate/reporting.py",
    "src/supportability_gate/standard_results.py",
    "tests/hosted_quality_profile.py",
    "tests/test_evaluate_complexity.py",
    "tests/test_standard_results.py",
]

[responsibility_boundary]
path = "src/supportability_gate/complexity_metrics.py"
owns = "Exact per-function Python McCabe and TypeScript classic metrics, isolated Ruff execution, normalized C901 diagnostics, and bidirectional Ruff parity before reporting."
does_not_own = "Changed-line selection, progressive policy decisions, hosted quality capture, modularity coverage, aggregate lane composition, advisory review, target repository execution, workflow orchestration, or GitHub mutation."

[incremental_refactor]
target = "Complete only Project #10 S03 Gate 1 Python and TypeScript/TSX qualification, exact evidence binding, lane isolation, protected canaries, and terminal ledger transaction; do not begin S04 or redesign Gates 2-8."
completed_step = "One runnable slice corrects existing Gate 1 identities, metrics, Ruff mapping, exit ownership, new-location coverage, touched evidence serialization, aggregate cross-binding, and the minimal producer dependency while retaining existing schemas, commands, workflows, thresholds, and modules."

[review_handoff]
summary = "Issue #146 owner-authorizes this bounded S03 slice. Local Python 3.12.13 source proof passed on the initial implementation head, and protected Source Validation passed. Required run 32856379536 then exposed the minimal producer importing tree-sitter transitively; the current correction moves the shared predicate to the existing contract leaf and adds a direct import-boundary regression. No focused review request has been posted, and no protected merge or canary result is claimed."
remaining_risks = [
    "The corrected head still needs exact full source proof, protected deterministic evidence, eight serial focused completions, supported-finding disposition, zero unresolved threads, and normal merge without bypass.",
    "Protected never-merge Python and frontend/component valid-plus-complexity-11 canaries, shared-artifact poison, durable temporary-ruleset snapshots, rejection proof, and cleanup remain unclaimed until exact GitHub evidence exists.",
    "Class-field initializers and class-static blocks are ESLint implicit code paths, not S03 Gate 1 function identities; they do not leak into enclosing metrics, and independent enforcement requires separate owner authorization and binding rules.",
    "The Gate never imports or executes target repository code; existing target-native characterization and quality commands execute only inside the isolated hosted target workflow as supporting authenticated evidence.",
    "Codex judgment remains advisory, probabilistic, and non-exhaustive even after all eight focused reviews complete.",
]

[human_review]
naming = "command_failed names the one shared fixed exit classifier; changed-function collection, metrics, reporting, and standard-results binding keep their existing responsibility names without generic helpers."
cohesion = "Every correction stays in the existing owner of the behavior, and the only shared predicate moves to the existing dependency-free contract leaf used by all consumers."
intended_behavior = "Issue #146 limits the change to Gate 1 qualification and direct proof. Packages, workflow command vectors, schemas, thresholds, target product code, production rulesets, class-implicit identities, S04, and Gates 2-8 redesign remain excluded."
reviewability = "Reviewed paths enumerate the exact implementation, proof, review document, and prospective ledger scope. The handoff distinguishes passed local/source evidence from the failed diagnostic run and every still-unclaimed hosted, advisory, merge, canary, cleanup, and Project fact."

[[module_boundaries]]
path = "src/supportability_gate/contract.py"
owner_path = "src/supportability_gate/contract.py"
basis = "responsibility"
justification = "This dependency-free leaf already owns fixed per-language complexity adapter identities and now owns their single ordinary-exit classification without pulling analyzers into minimal consumers."

[[module_boundaries]]
path = "src/supportability_gate/function_changes.py"
owner_path = "src/supportability_gate/function_changes.py"
basis = "responsibility"
justification = "This module owns stable nested Python and TypeScript/TSX function identities and now visits parameter-owned callbacks as part of the same parse responsibility."

[[module_boundaries]]
path = "src/supportability_gate/complexity_metrics.py"
owner_path = "src/supportability_gate/complexity_metrics.py"
basis = "responsibility"
justification = "This module owns exact static complexity measurement and Ruff parity, including approved TypeScript classic constructs and Python definition-line diagnostic mapping."

[[module_boundaries]]
path = "src/supportability_gate/quality_profile.py"
owner_path = "src/supportability_gate/quality_profile.py"
basis = "responsibility"
justification = "This module owns authenticated hosted quality evidence and delegates only the fixed ordinary-exit classification to the contract leaf."

[[module_boundaries]]
path = "src/supportability_gate/modularity_policy.py"
owner_path = "src/supportability_gate/modularity_policy.py"
basis = "responsibility"
justification = "This module owns new-location coverage and treats an authenticated ordinary complexity policy exit as execution coverage without changing Gate 4 policy."

[[module_boundaries]]
path = "src/supportability_gate/reporting.py"
owner_path = "src/supportability_gate/reporting.py"
basis = "responsibility"
justification = "This module owns authoritative result serialization and emits only touched Ruff diagnostics after full in-memory changed-file parity succeeds."

[[module_boundaries]]
