schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Accept schema-5 module characterization evidence through the exact-head manifest-selected transport and existing module authorization join, retaining all validation limits and exact identities."
proof = "Focused generic module tests exercise large schema-4 and schema-5 results with actual native function observations through both readers. Negative controls reject wrong schema, duplicate keys, over-limit input, legacy-manifest substitution, absent grants and invalid inventories."

[characterization]
captured_behavior = "Schema-4 module results keep their existing bounded path. Schema-5 module results now reach the same deterministic validators instead of being rejected by stale schema-4 dispatch."
proof = "Positive transports preserve exact result bytes and public validation. The corresponding failure controls retain malformed-result and introduction-authorization blocks; no case changes execution or oracle checks."

[separation_of_concerns]
before = "Two evidence readers and the introduction join retained schema-4-only dispatch after schema-5 correction support was added."
after = "Readers derive result transport from authenticated Git manifest identity, and the existing authorization join admits both supported module evidence versions while retaining exact inventory and grant validation."
boundaries = [
  { path = "src/supportability_gate/refactor_policy.py", kind = "function", symbol = "_read_characterization_result", before = "Large schema-5 evidence was parsed as result v4 and rejected before refactor verification.", after = "Resolve the exact-head manifest before selecting the bounded result v4 or v5 reader; preserve ordinary result handling and fail closed on malformed evidence." },
  { path = "src/supportability_gate/refactor_policy.py", kind = "function", symbol = "introduction_authorization_blocks", before = "Schema-5 module facts were disallowed by a schema-4-only module dispatch predicate.", after = "Admit module fact parsing for both v4 and v5 while preserving every inventory, birth, grant and target check." },
  { path = "src/supportability_gate/standard_results_producer.py", kind = "function", symbol = "_module_characterization_head", before = "Manifest selection returned only a boolean and lost the selected schema version.", after = "Return the exact supported result schema derived from the fixed target checkout manifest." },
  { path = "src/supportability_gate/standard_results_producer.py", kind = "function", symbol = "_read_characterization", before = "The aggregate producer hardcoded result v4 despite accepting a schema-5 manifest.", after = "Use the manifest-derived result schema with the existing bounded duplicate-safe aggregate decoder." },
]

[architecture]
dependency_direction = "Preserved: refactor policy and the result producer consume existing characterization manifest/codec functions; no target execution or policy authority moves into readers."
reviewed_paths = [".supportability-review.toml", "docs/product/Repository-Configuration.md", "src/supportability_gate/refactor_policy.py", "src/supportability_gate/standard_results_producer.py", "tests/test_characterization_capacity.py", "tests/test_module_introduction.py"]

[responsibility_boundary]
path = "src/supportability_gate/standard_results_producer.py"
owns = "Authenticated-source selection, bounded evidence loading and assembly of the authoritative result."
does_not_own = "Semantic truth, target-native execution, owner grants, production behavior changes or GitHub protection configuration."

[incremental_refactor]
target = "Complete schema-5 module evidence dispatch at the existing transport and authorization boundaries."
completed_step = "Select the exact result schema from the actual manifest in both readers and admit v5 module facts through unchanged grant validation."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Manifest-selected transport and module evidence retain established domain names and exact responsibilities."
cohesion = "Reader selection remains in existing consumers; the canonical result schema mapping and module validators remain in characterization."
intended_behavior = "Valid schema-5 module evidence reaches deterministic policy evaluation without allowing payload-controlled schema selection, expanded limits, or skipped authorization."
reviewability = "Four exact production boundaries, focused large-module transport and grant controls, and one documentation addition; no workflow, threshold, limit, scope, context or bypass changes."
