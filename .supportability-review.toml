schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "The product definition in README and the canonical wiki Home page links Supportability Standard to the immutable Standard at its existing repository path."
proof = "Verify both Markdown link targets, the Standard hash, the protected final-head checks, and the published wiki link from the exact documentation merge."

[characterization]
captured_behavior = "Production modules, characterization inputs, golden files, workflows, and policy remain unchanged."
proof = "Compare executable and immutable inputs against the base and retain existing hosted base/head evidence."

[separation_of_concerns]
before = "The opening product definition names the Standard without a direct hyperlink."
after = "README and canonical Home provide a direct link; the wiki projects canonical Home after protected merge."
boundaries = []

[architecture]
dependency_direction = "No production module or dependency direction changes."
reviewed_paths = [".supportability-review.toml", "README.md", "docs/product/Home.md"]

[responsibility_boundary]
path = "docs/product/Home.md"
owns = "The canonical product introduction and its direct Standard hyperlink."
does_not_own = "Policy wording, runtime enforcement, repository enrollment, or deployment protection."

[incremental_refactor]
target = "Owner-requested introductory hyperlinks and corresponding manual wiki publication; no production refactor target."
completed_step = "Link both product definitions to the existing immutable Standard without changing the surrounding product claims."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Supportability Standard is the visible link text and names the actual policy document."
cohesion = "Only the two product introductions and required current review evidence change."
intended_behavior = "Readers can open the actual Standard directly from either introductory definition."
reviewability = "The small Markdown change preserves wording and uses the correct relative target from each file location."
