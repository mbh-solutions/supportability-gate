schema_version = "1.0"

[behavior]
intended_behavior = "A canonical Gate 5 policy block cannot manufacture or suppress an ordinary Gate 6 result. Gate 6 always checks schema and exact repository/base/head identity; evidence claiming PASS also receives policy-block consistency, production-path coverage, and scenario compatibility checks."
proof = "tests/test_refactor_policy.py::{test_gate_five_policy_block_does_not_manufacture_gate_six_block,test_gate_five_block_preserves_independent_gate_six_blocks,test_non_runnable_intermediate_state_blocks,test_pass_claim_with_policy_blocks_checks_remaining_runnability}; tests/test_standard_results.py::test_authentic_gate_five_poison_blocks_only_gate_five"

[characterization]
captured_behavior = "The retained refactor-policy CLI baseline remains unchanged. Direct tests distinguish a canonical Gate 5 BLOCK from forged Gate 5 PASS claims carrying incompatible or internally contradictory runnability facts."
proof = ".supportability-characterization.json; tests/characterization/refactor-policy-retained.characterization.py; tests/characterization/refactor-policy-retained.golden.json; tests/test_refactor_policy.py; tests/test_standard_results.py"

[separation_of_concerns]
before = "Gate 6 reclassified every canonical Gate 5 policy BLOCK as non-runnable and rechecked Gate 5 coverage, creating ordinary cross-lane blocks."
after = "Gate 5 retains its ordinary policy result. Gate 6 preserves independent schema and identity checks, then validates coverage and compatibility only when characterization claims PASS."
boundaries = [
    { path = "src/supportability_gate/refactor_policy.py", kind = "function", symbol = "_characterization_blocks", before = "Converted a canonical Gate 5 BLOCK into Gate 6 non-runnable and missing-coverage blocks.", after = "Returns after Gate 6 identity checks when Gate 5 already owns an ordinary policy BLOCK; claimed PASS evidence still receives full Gate 6 validation." },
]

[architecture]
dependency_direction = "refactor_policy consumes the existing characterization result without importing Gate 5 implementation. It validates only Gate 6 identity and claimed-PASS runnability facts; standard_results independently applies the Gate 5 policy result to Gate 5."
reviewed_paths = [
    ".supportability-review.toml",
    "docs/product_completion_contract.md",
    "src/supportability_gate/refactor_policy.py",
    "tests/test_refactor_policy.py",
]

[responsibility_boundary]
path = "src/supportability_gate/refactor_policy.py"
owns = "Exact owner authorization, bounded refactor identity, sequence, and validation of runnability evidence that claims PASS."
does_not_own = "Gate 5 characterization policy, characterization coverage enforcement, aggregate lane composition, target execution, thresholds, exclusions, waivers, or later-slice behavior."

[incremental_refactor]
target = "Correct only the S07 Gate 5-to-Gate 6 ordinary-policy ownership leak exposed by canary preflight."
completed_step = "Stop Gate 6 semantic reclassification after a canonical Gate 5 policy BLOCK while retaining Gate 6 checks for stale, malformed, or forged PASS evidence."

[review_handoff]
summary = "Corrective S07 PR after #163: one production line changes `NON_RUNNABLE_LOGICAL_STEP` propagation into an ownership-preserving return. One RED/GREEN regression proves missing characterization coverage remains Gate 5 only; a companion test proves incompatible evidence that falsely claims PASS still blocks Gate 6. The corrective PR requires its own eight serial focused reviews and must merge normally before the Python/frontend canaries resume."
remaining_risks = [
    "The post-merge Python and frontend canaries remain the terminal proof that real hosted missing coverage blocks Gate 5 alone.",
    "S08 Gate 6 qualification remains separate and is not implemented by this correction.",
]

[human_review]
naming = "The changed function and two direct tests name the exact characterization-to-refactor ownership boundary."
cohesion = "Gate 5 policy stays in characterization and standard_results; refactor_policy retains only Gate 6 authorization and claimed-PASS runnability checks."
intended_behavior = "A genuine Gate 5 block does not suppress or manufacture Gate 6; a claimed-PASS policy, coverage, or scenario defect remains fail-closed in Gate 6."
reviewability = "The production change is one existing condition split at its ownership boundary, with one observed RED/GREEN regression and direct fail-closed PASS-claim cases."
