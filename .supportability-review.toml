schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "The consumed S07 characterization transition is absent after its protected replacement merge."
proof = "The protected Gate verifies the unchanged v5 obligation without reporting a stale transition."

[characterization]
captured_behavior = "The retained v5 obligation and golden output remain unchanged."
proof = "Base and head characterization captures remain valid while the consumed transition row is removed."

[separation_of_concerns]
before = "The one-use transition remained present after its source obligation had already been replaced."
after = "The manifest retains the v5 obligation with an empty transition list."
boundaries = []

[architecture]
dependency_direction = "No production dependency or module boundary changes."
reviewed_paths = [
  ".supportability-characterization.json",
  ".supportability-review.toml",
]

[responsibility_boundary]
path = ".supportability-characterization.json"
owns = "Current protected characterization scenarios, obligations, and unconsumed transitions."
does_not_own = "Production behavior, authorization policy, or quality thresholds."

[incremental_refactor]
target = "S07 post-merge characterization transition retirement."
completed_step = "Removed the consumed v4-to-v5 transition while retaining the v5 obligation."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "The retained obligation and empty transition list state the current manifest directly."
cohesion = "Only characterization metadata and its exact review evidence change."
intended_behavior = "Later pull requests no longer inherit a stale transition policy block."
reviewability = "The diff removes one consumed transition and updates its bounded evidence."
