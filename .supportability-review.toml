schema_version = "1.0"

[behavior]
intended_behavior = "Project #10 S04 makes Gate 2 require complete structured before/after rows for every changed Python or TypeScript/TSX responsibility identity, bind those rows to the immutable base/head diff, isolate ordinary boundary defects to Gate 2, and surface boundary-derivation failures as explicit Gate 2 technical evidence."
proof = "tests/test_evaluate_complexity.py::{test_modified_boundary_binds_retained_head_identity,test_deleted_boundary_binds_base_identity,test_deleted_boundary_in_retained_file_does_not_bind_unchanged_neighbor,test_renamed_boundary_binds_base_and_head_identities,test_added_tsx_boundary_binds_component_and_function_identities,test_module_boundary_uses_path_as_symbol,test_empty_boundaries_pass_when_diff_has_no_applicable_identity,test_real_diff_separation_boundary_poison_blocks,test_extra_nonduplicate_boundary_rejects_cardinality_mismatch,test_real_indexed_boundary_poison_blocks_only_gate_two_after_aggregation,test_cross_lane_review_poison_still_validates_gate_two_boundaries,test_cross_lane_review_poison_preserves_valid_gate_two_evidence,test_separation_boundary_outputs_are_byte_identical,test_syntax_error_is_technical_failure,test_non_regular_production_source_reports_boundary_derivation_failure}; tests/test_standard_results.py::{test_boundary_evidence_poison_blocks_gate_two_only,test_indexed_boundary_evidence_poison_blocks_gate_two_only,test_boundary_derivation_failure_is_gate_two_technical_only,test_other_lane_poison_cannot_excuse_missing_gate_two_review_evidence}"

[characterization]
captured_behavior = "Real immutable Git fixtures cover retained, retained-file deletion, deleted, renamed, added TSX component/function, module, empty, missing, malformed, insufficient, duplicate, nonexistent, unchanged, stale, mismatched, extra-cardinality, syntax-error, non-regular-source, and cross-lane poison cases. Aggregate fixtures prove ordinary top-level and indexed boundary defects block only Gate 2 and derivation failure remains a Gate 2 technical result. The gate2-standard-results-boundary scenario cryptographically binds and replays the established aggregate driver on both immutable source sides, adapts only the added Gate 2 schema field, proves exact boundary comparison rejects a forged identity, validates each side's real review document, and normalizes synthetic input provenance that is not behavior."
proof = "tests/test_evaluate_complexity.py; tests/test_standard_results.py; .supportability-characterization.json; tests/characterization/standard-results-boundary.characterization.py; tests/characterization/gate2-standard-results-boundary.characterization.py; tests/characterization/gate2-standard-results-boundary.golden.json"

[separation_of_concerns]
before = "Review evidence had summary text but no exact responsibility rows. Initial S04 binding emitted indexed row defects without recognizing their Gate 2 ownership, coupled boundary derivation to review-document loading, swallowed parser failures, misclassified source Git failures as review-document defects, and left branch evidence describing the prior milestone."
after = "Review evidence owns strict boundary-row shape and exact immutable-diff identity equality. Indexed row defects map only to Gate 2. CLI orchestration derives identities separately from review-document loading, preserves valid review fields for unaffected lanes when derivation fails, and emits one declared Gate 2 technical code. Aggregate validation mirrors the schema and branch evidence describes only S04."
boundaries = [
    { path = "src/supportability_gate/cli.py", kind = "function", symbol = "_evaluate", before = "Loaded review evidence without immutable responsibility identities.", after = "Supplies immutable repository, policy, assessment, and error context to Gate 2 evidence loading." },
    { path = "src/supportability_gate/cli.py", kind = "function", symbol = "_read_review_evidence", before = "Read review TOML without exact boundary derivation.", after = "Separates boundary derivation from review-blob loading and records deterministic Gate 2 derivation failure." },
    { path = "src/supportability_gate/cli.py", kind = "function", symbol = "_separation_boundaries", before = "Had no Gate 2 responsibility-identity derivation.", after = "Derives exact changed responsibility identities from immutable Git sides." },
    { path = "src/supportability_gate/review_evidence.py", kind = "function", symbol = "_validate_separation_boundaries", before = "Had no structured boundary-row validation.", after = "Validates exact row shape, text, kind, uniqueness, and expected identity equality when derivation is available." },
    { path = "src/supportability_gate/review_evidence.py", kind = "function", symbol = "evaluate_review_evidence", before = "Validated review shape without expected boundary identities.", after = "Validates Gate 2 structure and exact identities independently from other review-lane defects or preserves structural evidence during declared derivation failure." },
    { path = "src/supportability_gate/review_evidence.py", kind = "function", symbol = "parse_review_evidence", before = "Parsed fixed review fields without responsibility rows.", after = "Parses required separation rows and conditionally checks immutable identity equality." },
    { path = "src/supportability_gate/review_evidence.py", kind = "module", symbol = "src/supportability_gate/review_evidence.py", before = "Did not own Gate 2 boundary-row schema fields.", after = "Owns fixed separation boundary schema validation." },
    { path = "src/supportability_gate/standard_block_ownership.py", kind = "function", symbol = "_emitted_review_location", before = "Rejected non-MALFORMED indexed separation-row locations.", after = "Recognizes only emit-capable indexed row roots, schema fields, kinds, and indices." },
    { path = "src/supportability_gate/standard_block_ownership.py", kind = "function", symbol = "technical_owners", before = "Had no exact owner for boundary-derivation technical failure.", after = "Assigns the declared boundary-derivation technical code only to Gate 2." },
    { path = "src/supportability_gate/standard_block_ownership.py", kind = "module", symbol = "src/supportability_gate/standard_block_ownership.py", before = "Did not assign boundary defects or derivation failure to Gate 2.", after = "Owns exact Gate 2 policy and technical mappings for boundary evidence." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_complexity_components", before = "Required complete shared review evidence unless all review lanes had technical failure.", after = "Accepts owner-bound ordinary review poison while preserving strict evidence requirements for unaffected inputs." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_review", before = "Accepted separation summaries without boundary rows and only tolerated shared review failure.", after = "Requires strict aggregate boundary rows and validates preserved Gate 2 evidence when another lane owns review poison." },
    { path = "src/supportability_gate/standard_results.py", kind = "function", symbol = "_s02_separation_boundaries", before = "Had no aggregate boundary-row validator.", after = "Validates aggregate separation summaries, boundary-row shape, and identity uniqueness." },
]

[architecture]
dependency_direction = "CLI orchestration supplies immutable Git context to the existing review-evidence validator. The aggregate result composer depends on the existing block-ownership leaf for exact Gate 2 policy and technical ownership. Production Gate execution still never imports or executes analyzed consumer-repository code. Trusted source characterization imports only this repository's own immutable base/head modules; no production module, package, workflow, or dependency was added."
reviewed_paths = [
    ".supportability-characterization.json",
    ".supportability-review.toml",
    "docs/product_completion_contract.md",
    "src/supportability_gate/cli.py",
    "src/supportability_gate/review_evidence.py",
    "src/supportability_gate/standard_block_ownership.py",
    "src/supportability_gate/standard_results.py",
    "tests/characterization/gate2-standard-results-boundary.characterization.py",
    "tests/characterization/gate2-standard-results-boundary.golden.json",
    "tests/characterization/standard-results-boundary.characterization.py",
    "tests/test_evaluate_complexity.py",
    "tests/test_standard_results.py",
]

[responsibility_boundary]
path = "src/supportability_gate/review_evidence.py"
owns = "Fixed structured review-evidence parsing, Gate 2 boundary-row validation, and exact expected-identity comparison when immutable derivation succeeds."
does_not_own = "Git repository identity, changed-line discovery, source parsing, aggregate lane composition, advisory review, target repository execution, workflow orchestration, GitHub mutation, or prose truth judgment."

[incremental_refactor]
target = "Complete only Project #10 S04 Gate 2 exact responsibility binding, ordinary-poison isolation, explicit derivation-failure propagation, direct proof, and prospective terminal ledger transaction."
completed_step = "Bound exact Python and TypeScript/TSX responsibility identities, mirrored strict aggregate validation, repaired indexed row ownership and cross-lane validation, removed false deletion anchors for retained files, separated derivation from review loading, added focused syntax/non-regular composition proof, replaced stale branch evidence, reduced the real parser decision count to the enforced maximum, and made the immutable-side-compatible Gate 2 characterization scenario exercise exact identity rejection."

[review_handoff]
summary = "Issue #147 is the sole active slice. Hosted frozen-head run 32925228922 on 0c45b323eb8b64443b3a49f1601b44c1048685a3 passed deterministic qualification and the required serial eight-focus lifecycle completed exactly once. Five findings were evaluated together. This single remediation batch preserves independently validated Gate 2 evidence across other-lane poison, removes false deletion anchors in retained files, exercises exact identity rejection in characterization, and clarifies prospective versus live ledger truth. No focus is repeated and no review will be requested on the final head. Final exact source proof, deterministic-only hosted qualification, protected canaries, normal merge, cleanup, and Project readback remain required and are not claimed here."
remaining_risks = [
    "The bounded post-review remediation requires directly relevant and full exact-lock source proof on its committed final head, followed only by fresh hosted deterministic qualification.",
    "Protected normal merge, Python/frontend canaries, cleanup, issue closure, and Project transition remain required before S04 completion.",
    "Gate 2 proves row structure and immutable identity association only; it does not judge the truth or quality of before/after prose, and Codex review remains advisory and non-exhaustive.",
]

[human_review]
naming = "SEPARATION_BOUNDARY_DERIVATION_FAILURE names the exact failed Gate 2 operation; existing parsing, ownership, and composition responsibilities retain their established names."
cohesion = "Review schema validation stays in review_evidence, immutable orchestration stays in cli, ownership stays in standard_block_ownership, and aggregate validation stays in standard_results."
intended_behavior = "Issue #147 limits this change to Gate 2 qualification and direct proof. Packages, workflows, thresholds, target commands, target execution, immutable documents, later slices, and other lane semantics remain excluded."
reviewability = "The single post-review remediation batch changes only the five evaluated findings; final deterministic and external delivery evidence remains explicitly pending."
