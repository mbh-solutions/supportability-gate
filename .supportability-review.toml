schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Execute the complete Python collection in four fixed partitions, verify native capture identity and complete worker execution, then combine branch data under the existing coverage rules. Run two characterization scenarios concurrently while preserving manifest order and both fresh executions."
proof = "Twenty-one focused partition and failure controls pass. A real four-partition reproduction executes the same six existing expensive cases exactly once and preserves all raw lines and arcs plus the complete exported coverage report. Native protected source proof and a complete consumer timing run remain required."

[characterization]
captured_behavior = "The public fixed command vectors, production evaluator, witness definitions and frozen golden bytes are unchanged. Concurrency changes execution scheduling while each characterization scenario retains two fresh disposable executions and ordered semantic output."
proof = "Focused capture controls verify unchanged authoritative bytes, manifest order, both concurrent failure records and bounded diagnostics without exposing exception details. Existing protected characterization captures remain the source-bound compatibility proof."

[separation_of_concerns]
before = "One hosted quality job executes all Python tests with two isolated workers. Characterization executes all scenarios sequentially."
after = "The trusted pytest guard records complete and selected collections; each hosted collector executes one fixed partition; the new hosted join authenticates native artifacts and recomputes combined coverage obligations. The characterization collector bounds concurrency at two scenarios."
boundaries = []

[architecture]
dependency_direction = "Preserved: target execution stays within isolated hosted collectors; the join consumes native artifacts and existing contract and coverage rules. Static production policy modules and their dependency direction are unchanged."
reviewed_paths = [".github/workflows/organization-required.yml", ".supportability-review.toml", "docs/product/Evidence-Model.md", "tests/hosted_characterization.py", "tests/hosted_quality_aggregate.py", "tests/hosted_quality_profile.py", "tests/quality_pytest_guard.py", "tests/test_characterization_capture_timing.py", "tests/test_quality_partitions.py"]

[responsibility_boundary]
path = "tests/hosted_quality_aggregate.py"
owns = "Authenticate fixed native quality partitions, require full exact-once test completion and worker branch receipts, combine raw coverage, and retain explicit provenance for the ordinary quality attestation."
does_not_own = "Consumer business behavior, alternate policy decisions, test exclusions, changed thresholds, owner authorization or success for omitted execution."

[incremental_refactor]
target = "Reduce fixed hosted capture latency without reducing required work or proof."
completed_step = "Distribute complete Python execution across four native captures, join authenticated evidence, and execute characterization with bounded concurrency."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Partition receipts, native captures, full collections and combined coverage name the concrete responsibilities."
cohesion = "Scheduling and artifact joining stay in hosted helper boundaries. The authoritative production evaluator and consumer production code are unchanged."
intended_behavior = "Missing, stale, duplicate or incomplete partition evidence blocks qualification. Existing policy exit classification and terminal command-failure evidence are preserved."
reviewability = "One bounded performance change with retained before-and-after execution and coverage evidence, focused failure controls, exact protected delivery and a full consumer timing measurement."
