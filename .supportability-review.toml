schema_version = "1.0"
module_boundaries = [
  "refactor_policy owns authenticated authorization and decision production",
  "refactor_targets owns fixed source-to-test path association",
  "standard_results independently validates and composes evidence",
]

[behavior]
intended_behavior = "Focused refactor authorization accepts exact ordinary related tests without broad approval, distinguishes independent refactor series from continuations, and fails closed for stale, forged, substituted, or unavailable evidence."
proof = "Focused and full regression suites cover ordinary and characterization tests, thousand-line footprint handling, independent step one, exact continuation, wrong-series and forged predecessor failures, and independent result composition."

[characterization]
captured_behavior = "Existing characterization proof paths retain their accepted treatment while ordinary tests require an exact fixed-profile related-test declaration."
proof = "Protected Gate 8 boundary characterization drivers exercise the schema 2.0 authorization payload through both decision and independent standard-result paths."

[separation_of_concerns]
before = "Authorization treated every ordinary test as unrelated scope and used adjacent predecessor step numbers without a refactor-series identity."
after = "Authorization carries exact related-test associations and a series identifier; production and independent result composition validate both using separate implementations."
boundaries = [
  "refactor_policy parses owner comments and emits the Gate 6 decision",
  "refactor_targets applies the fixed filename association",
  "standard_results independently reconstructs authorization validity",
]

[architecture]
dependency_direction = "refactor_policy depends on refactor_targets for target association; standard_results independently validates evidence without importing analysis dependencies."
reviewed_paths = [
  "src/supportability_gate/refactor_policy.py",
  "src/supportability_gate/refactor_targets.py",
  "src/supportability_gate/standard_results.py",
  "tests/characterization/gate8-standard-results-boundary-v2.characterization.py",
  "tests/characterization/gate8-standard-results-boundary-v3.characterization.py",
  "tests/test_evaluate_complexity.py",
  "tests/test_refactor_policy.py",
  "tests/test_standard_results.py",
  "docs/refactor_authorization.md",
  ".supportability-review.toml",
]

[responsibility_boundary]
path = "src/supportability_gate/refactor_policy.py"
owns = "Authenticated schema 2.0 authorization, related-test focus decisions, and series-aware predecessor decisions."
does_not_own = "Git diff discovery, function span derivation, characterization execution, quality thresholds, waivers, or semantic review."

[incremental_refactor]
target = "Project 25 S07 focused regression authorization and series-safe incremental refactors."
completed_step = "Added exact related-test declarations and series-bound continuation validation while preserving the existing fail-closed result vocabulary."

[review_handoff]
summary = "Schema 2.0 adds exact related_tests and sequence.series_id fields, with independent standard-result validation and no new override path."
remaining_risks = ["Runtime and protected canary proof remain required before the S07 delivery ledger can be recorded."]

[human_review]
naming = "related_tests, series_id, and INVALID_STRANGLER_SEQUENCE state the authenticated evidence and failure boundary directly."
cohesion = "Each production module retains one existing responsibility and every new branch is exercised by direct tests."
intended_behavior = "Ordinary related tests can remain narrow only when their fixed path association and exact targets match; series continuations cannot skip, replay, switch, or substitute targets."
reviewability = "The change is bounded to three existing production modules, their direct and protected tests, one owner-format document, and exact review evidence."
