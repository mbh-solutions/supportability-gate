schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "The required Supportability workflow and merge rules depend only on eight deterministic gate lanes. Codex connector review is optional advisory input; missing acknowledgement, timeout, outage, unavailable review, or absent completion never delays or fails delivery."
proof = "tests/test_standard_results.py::test_workflow_keeps_advisory_review_out_of_the_required_path; .github/workflows/organization-required.yml; AGENTS.md; docs/product_completion_contract.md"

[characterization]
captured_behavior = "Before this correction, the required workflow waited up to 70 minutes for connector acknowledgement and completion, and the aggregate Gate failed when those jobs did not succeed. The direct workflow test now proves observer and collector jobs are absent and the aggregate depends only on deterministic evidence plus the eight-lane matrix."
proof = "tests/test_standard_results.py::test_workflow_keeps_advisory_review_out_of_the_required_path"

[separation_of_concerns]
before = "The required deterministic workflow also owned connector observation and completion, turning advisory review availability into a delivery dependency."
after = "The required workflow owns deterministic evidence and enforcement only. Optional Codex review remains outside the required path, while native review-thread resolution governs any actual inline conversation."
boundaries = [
    { path = "tests/test_standard_results.py", kind = "function", symbol = "test_workflow_keeps_advisory_review_out_of_the_required_path", before = "No direct structural regression named or enforced the advisory-only connector boundary.", after = "The direct structural regression proves connector jobs and aggregate connector dependencies are absent from the required workflow." },
    { path = "tests/test_standard_results.py", kind = "function", symbol = "test_workflow_wires_conditional_reviews_independent_matrix_and_final_gate", before = "The structural regression required connector observer and collector wiring in the merge path.", after = "That blocking contract is removed and replaced by the advisory-only regression." },
]

[architecture]
dependency_direction = "Required enforcement depends on authenticated deterministic artifacts and eight lane enforcers only. Optional external review cannot feed a required job, check, ruleset, merge, milestone, or completion decision."
reviewed_paths = [
    ".github/workflows/organization-required.yml",
    ".supportability-review.toml",
    "AGENTS.md",
    "docs/product_completion_contract.md",
    "tests/test_standard_results.py",
]

[responsibility_boundary]
path = ".github/workflows/organization-required.yml"
owns = "Authenticated deterministic evidence production, eight independent Standard checks, and their aggregate result."
does_not_own = "Codex availability, acknowledgement, completion, advisory judgment, retries, or optional review scheduling."

[incremental_refactor]
target = "Restore the intended non-blocking advisory boundary without changing any deterministic lane, threshold, scope, target command, package, or ruleset safety property."
completed_step = "Removed two connector jobs and their aggregate dependencies from the required workflow, replaced the repository review contract with a best-effort advisory rule, and aligned the terminal S11 ledger."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "The required job is explicitly named deterministic; the repository contract names Codex review optional and advisory."
cohesion = "Workflow enforcement, its direct structural regression, repository instructions, and terminal product status each retain one existing responsibility."
intended_behavior = "Connector failure means move on; deterministic failure still blocks; an existing inline conversation still requires native resolution."
reviewability = "The executable change deletes connector wiring from one workflow and adjusts one direct structural test. No production Python, target code, package, command, threshold, exclusion, waiver, or bypass changes."
