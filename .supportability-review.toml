schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Preserve a sealed module oracle review across behavior-preserving implementation changes when the identical scenario and review already exist in the comparison base. New scenarios still require exact current source and inventory binding."
proof = "Successive real-observation refactors plus negative behavior, witness, review, oracle, driver, and new-scenario tests. Hosted qualification measures both preserving and forbidden changes."

[characterization]
captured_behavior = "Existing module observation, source inventory, golden compatibility and named-body execution remain enforced."
proof = "Existing frozen characterization scenarios and fresh source-bound base/head execution evidence."

[separation_of_concerns]
before = "Module review validation required a current implementation fingerprint while definition preservation forbade updating that review."
after = "Admission review remains immutable; independently derived current inventories and observed execution establish ongoing compatibility."
boundaries = [
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_api_oracle_review", before = "Validate every module review against current source.", after = "Identify sealed existing module reviews before validating their bindings." },
  { path = "src/supportability_gate/characterization.py", kind = "function", symbol = "_module_review_matches", before = "Require head fingerprints for both admission and preservation.", after = "Keep exact oracle and roots; require head fingerprints for new admissions and preserve historical bindings for unchanged admitted reviews." }
]

[architecture]
dependency_direction = "Characterization reads fixed Git blobs and statically derived source facts. Native execution remains in the existing isolated capture boundary."
reviewed_paths = ["src/supportability_gate/characterization.py"]

[responsibility_boundary]
path = "src/supportability_gate/characterization.py"
owns = "Source-bound characterization evidence validation and behavior-preservation decisions."
does_not_own = "Consumer behavior, sandbox configuration, policy waivers or human attestations."

[incremental_refactor]
target = "Remove the contradictory current-source versus immutable-review requirements for established module scenarios."
completed_step = "Separate original review admission binding from current independently verified execution without changing protected expectations."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Preserved module review identifies exact base scenario and byte identity."
cohesion = "The existing characterization module owns the fix; no new production module."
intended_behavior = "Established unchanged expectations support preserving refactors; new scenarios and forged evidence remain blocked."
reviewability = "Author declaration only; existing source integrity, isolation and protected delivery remain mandatory."
