schema_version = "1.0"

[behavior]
intended_behavior = "Milestones 1-6 remain enforced while risky changes require exact-base and exact-head characterization with compatible behavior."
proof = "tests/test_characterization.py"

[characterization]
captured_behavior = "The pre-change 157-test suite and installed CLI behavior are the immutable base for Milestone 7."
proof = "tests/test_characterization.py"

[separation_of_concerns]
before = "Review text could claim characterization without authenticated base execution, exact artifact identity, replay, or post-change comparison."
after = "characterization runs fixed Python or Node drivers twice against exact base and head commits in separate hosted jobs, then verifies artifacts, golden identity, compatibility, and coverage before the existing evaluator."

[architecture]
dependency_direction = "The organization workflow points to characterization, which depends only on immutable contract and Git evidence; the existing evaluator and semantic-review paths remain unchanged and run after characterization passes."
reviewed_paths = [
    "src/supportability_gate/characterization.py",
    "src/supportability_gate/architecture_policy.py",
    "src/supportability_gate/cli.py",
    "src/supportability_gate/gate_policy.py",
    "src/supportability_gate/git_changes.py",
    "src/supportability_gate/github_app.py",
    "src/supportability_gate/reporting.py",
    "src/supportability_gate/semantic_cli.py",
    "src/supportability_gate/semantic_contract.py",
    "src/supportability_gate/semantic_review.py",
]

[responsibility_boundary]
path = "src/supportability_gate/characterization.py"
owns = "Fixed-convention hosted characterization capture, authenticated artifact verification, behavior compatibility, golden identity, replay, and coverage evidence."
does_not_own = "General quality-gate execution, refactor sizing, semantic model transport, GitHub authentication, check publication, or local target execution."

[incremental_refactor]
target = "Require one authenticated exact-base and exact-head characterization stage before the existing evaluator."
completed_step = "Added one fixed-convention module and separate hosted jobs without target-supplied commands, new dependencies, contract changes, or later-milestone gate execution."

[review_handoff]
summary = "Review exact checkout identity, isolated base/head execution, immutable artifact handoff, fixed Python and Node commands, golden immutability, deterministic replay, compatibility, and changed/high-risk path coverage."
remaining_risks = ["A missing or malformed manifest, driver, golden file, capture, or artifact identity intentionally fails the required workflow closed."]

[human_review]
naming = "Characterization names describe captures, manifests, golden outputs, behavior fingerprints, artifact identity, compatibility, and replay drift."
cohesion = "One characterization module owns Milestone 7 evidence; existing evaluator and semantic modules remain unchanged."
intended_behavior = "Existing enforcement remains; fixed Python and TypeScript characterization now blocks missing, stale, unauthenticated, changed, drifting, or incompatible evidence."
reviewability = "Focused fixtures cover both supported profiles, existing and new scenarios, exact identity, all required blocks, coverage, and deterministic verification."

[[module_boundaries]]
path = "src/supportability_gate/characterization.py"
owner_path = "src/supportability_gate/characterization.py"
basis = "responsibility"
justification = "Owns deterministic Milestone 7 capture and compatibility evidence through one fixed-convention hosted-job boundary."

[[module_boundaries]]
path = "src/supportability_gate/modularity_policy.py"
owner_path = "src/supportability_gate/modularity_policy.py"
basis = "responsibility"
justification = "Owns deterministic new-location justification, vague-location, coupling-edge, and complete-coverage evidence required by Enforcement Milestone 6."
