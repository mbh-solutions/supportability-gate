schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Preserve the failed PR 288 candidate and original evidence in a dated archive so its temporary branch can be removed. Runtime behavior is unchanged."
proof = "Only history documentation, retained evidence and this review record change; production and workflow blobs match the base."

[characterization]
captured_behavior = "Existing production characterization and goldens are unchanged. The historical failed candidate is retained as data and is not executed by current qualification."
proof = "Exact candidate recovery in an isolated bare repository, full Git object verification, artifact hashes and ZIP integrity; existing hosted base/head characterization."

[separation_of_concerns]
before = "A failed candidate was preserved on a remote branch and appeared to be active work."
after = "The dated history archive owns failure evidence and recovery instructions; the PR links the record and the obsolete branch can be removed after verified delivery."
boundaries = []

[architecture]
dependency_direction = "No production modules, imports, dependencies or workflows change. Documentation remains in the established historical-record boundary."
reviewed_paths = ["docs/history/2026-10-07/pr288-first-attempt/README.md", "docs/history/README.md"]

[responsibility_boundary]
path = "docs/history/2026-10-07/pr288-first-attempt/README.md"
owns = "Historical candidate identity, retained failure evidence, checksums and recovery instructions."
does_not_own = "Runtime behavior, current qualification decisions, deployment policy or new release authorization."

[incremental_refactor]
target = "Replace one obsolete archival branch with a verified historical record."
completed_step = "Retain the exact candidate and original run evidence, verify recovery, and document the branch cleanup sequence."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "The dated PR-specific archive identifies its historical purpose and failed status."
cohesion = "Candidate, original evidence, receipts and recovery instructions are colocated under the existing history directory."
intended_behavior = "The archived failure remains a failure; no executable behavior or protection changes."
reviewability = "Original artifact bytes, exact candidate recovery, explicit prerequisite and checksummed inventory support inspection."
