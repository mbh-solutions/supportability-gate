schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "The hosted pytest check stores temporary test data in its existing per-command writable sandbox area so SQLite-heavy target suites do not exhaust the small /tmp mount."
proof = "The PR #691 rerun under the new organization pin proved Python packages installed and TypeScript tests passed, then Python pytest failed with SQLite disk-full errors; a focused test verifies pytest's TMPDIR is /work/tmp."

[characterization]
captured_behavior = "The fixed Python test command, characterization scenarios, and protected behavior golden remain unchanged."
proof = "Only the hosted sandbox environment and its focused test change; the protected base and head characterization jobs must compare the same existing scenarios."

[separation_of_concerns]
before = "The hosted pytest check used the sandbox's 256 MB /tmp mount for all target temporary data, causing SQLite tests to fail with disk-full errors despite sufficient per-command writable storage."
after = "The hosted supervisor creates a temporary directory inside pytest's existing /work area and sets TMPDIR only for that sandboxed command."
boundaries = []

[architecture]
dependency_direction = "The hosted quality-profile supervisor selects the fixed pytest adapter and passes a bounded environment value through the existing quality runner sandbox interface."
reviewed_paths = [
  ".supportability-review.toml",
  "tests/hosted_quality_profile.py",
  "tests/test_target_python_dependencies.py",
]

[responsibility_boundary]
path = "tests/hosted_quality_profile.py"
owns = "Hosted selection of a per-command pytest temporary directory inside the established writable sandbox mount."
does_not_own = "Consumer source, the immutable Standard, quality policy decisions, the sandbox's fixed command, or organization ruleset configuration."

[incremental_refactor]
target = "Python quality temporary-storage defect exposed by twmn-portfolio PR #691."
completed_step = "Route pytest temporary files to /work/tmp for that command only, without changing the sandbox security boundary or pass/block policy."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "TMPDIR and the per-command work directory name the actual temporary-storage location directly."
cohesion = "The hosted adapter setup owns environment selection; the production quality runner only applies the supplied fixed value."
intended_behavior = "SQLite-heavy tests can use the existing writable work area while the source, dependencies, and evidence mounts remain read-only."
reviewability = "The repair changes one hosted command setup and one focused test; no production Gate code or controlled golden changes."
