[architecture]
dependency_direction = "The hosted adapter derives targets from immutable Git source, characterization owns obligation evidence, quality_profile proves required-body execution from fixed command artifacts, and standard_results independently recomposes the decision without executing target code."
reviewed_paths = [".supportability-review.toml", "src/supportability_gate/characterization.py", "src/supportability_gate/quality_profile.py", "src/supportability_gate/refactor_policy.py", "src/supportability_gate/standard_results.py", "tests/hosted_quality_profile.py", "tests/test_characterization.py", "tests/test_evaluate_complexity.py", "tests/test_quality_profile.py", "tests/test_refactor_policy.py", "tests/test_standard_results.py"]

[responsibility_boundary]
path = "src/supportability_gate/characterization.py"
owns = "Stable behavioral obligations, exact assertion retention, explicit digest-bound migration, and authenticated characterization coverage."
does_not_own = "Semantic review, target execution, command or threshold changes, waivers, protected transport, or successor remediation."

[incremental_refactor]
target = "Require meaningful retained behavior and executed changed responsibility bodies without changing fixed commands or adding a second policy engine."
completed_step = "Added stable obligations, exact migrations, meaningful case validation, target-bound runtime coverage, and independent result binding within existing Gate 5 and Gate 7 ownership."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Obligation, selector, transition, required target, executed line, and meaningful cases expose the deterministic decision inputs."
cohesion = "Manifest and capture meaning stay in characterization, runtime proof stays in quality_profile, and authenticated recomposition stays in standard_results."
intended_behavior = "A retained responsibility must keep meaningful input-to-output evidence and execute under the fixed quality command; exact declared migrations remain possible and auditable."
reviewability = "Focused positive and adversarial regressions expose exact obligation IDs, assertion digests, transition identities, responsibility spans, executed lines, and terminal block or technical-error codes."
