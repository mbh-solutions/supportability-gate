schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Current documentation and repository-retained bundles hand off the exact S08 result without converting unresolved consumer or policy-canary technical failures into PASS."
proof = "Each docs/qualification/*.zip file restores through supportability_gate.qualification_bundle and reports its bound decision, profile, repository, head, run, and manifest identity."

[characterization]
captured_behavior = "The qualification-bundle characterization continues to exercise missing-manifest, traversal, and release-context behavior; this final transaction changes documentation and retained artifacts only."
proof = "tests/characterization/s05-meaningful-behavior.characterization.py and its golden file remain unchanged, while the protected executable revision is already qualified and deployed."

[separation_of_concerns]
before = "Current-facing documentation did not yet index S08 durable restoration proof, observed runtime limits, or the final audit disposition."
after = "The scope and matrix define the product boundary, the disposition index owns current audit outcomes, the qualification index owns bundle identities, and the completion contract owns delivery history."
boundaries = []

[architecture]
dependency_direction = "Documentation and generated qualification archives consume the deployed bundle contract; they add no production import, runtime dependency, command, policy engine, or target-repository behavior."
reviewed_paths = [
  ".supportability-review.toml",
  "README.md",
  "docs/deterministic_assurance_disposition.md",
  "docs/enforcement_matrix.md",
  "docs/product_completion_contract.md",
  "docs/product_scope.md",
  "docs/qualification/README.md",
  "docs/qualification/s08-mixed-consumer-technical.zip",
  "docs/qualification/s08-pass-context.json",
  "docs/qualification/s08-policy-poison-with-technical-failure.zip",
  "docs/qualification/s08-provenance-technical-failure.zip",
  "docs/qualification/s08-python-consumer-technical.zip",
  "docs/qualification/s08-python-protected-pass.zip",
  "docs/qualification/s08-typescript-consumer-technical.zip",
]

[responsibility_boundary]
path = "docs/qualification/README.md"
owns = "The compact bundle index, exact durable hashes, restore command, measured observations, and limitations of the retained S08 evidence."
does_not_own = "Gate policy, target repair, runtime mutation, Project completion approval, Semantic Review, or a new evidence service."

[incremental_refactor]
target = "S08 lifecycle and evidence handoff."
completed_step = "Retained compact proof, reconciled current guarantee wording, and recorded unresolved limits without changing deployed enforcement."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Bundle, context, disposition, evidence, and lifecycle names match the deterministic records they describe."
cohesion = "Each current document owns one concise surface while the dated completion ledger preserves delivery history."
intended_behavior = "A controller can restore retained proof offline, verify exact identities, and see why S08 remains Partial without relying on chat or expiring Actions data."
reviewability = "The final change is documentation plus compact generated evidence; executable Gate and workflow bytes remain the already qualified deployed revision."
