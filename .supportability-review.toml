schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "Stable behavior obligations retain meaningful multi-input and multi-output evidence across scenario renames; exact digest-bound migrations are explicit, and malformed or nondeterministic evidence fails closed."
proof = "The activated S05 driver covers meaningful retained output, boundary ownership, result identity, quality suppression behavior, exact migration, additive obligations, obligation removal, scenario rename, constant output, nondeterminism, and malformed capture handling."

[characterization]
captured_behavior = "The protected v1 manifest could bind behavior to scenario names and matching goldens without independently preserving a stable responsibility obligation or proving nonconstant input-to-output behavior."
proof = "The schema-v2 manifest activates stable obligation IDs, exact selectors, authenticated targets, one digest-bound v3-to-v4 migration, and a dedicated S05 behavior scenario with retained positive and adversarial cases."

[separation_of_concerns]
before = "The live characterization inventory remained on schema v1 while the protected bootstrap deployed strict v1 and v2 consumers."
after = "The live manifest now declares obligations and transitions; existing Gate modules consume the activated evidence through the already protected bootstrap interfaces."
boundaries = []

[architecture]
dependency_direction = "The manifest declares evidence obligations, fixed characterization drivers produce behavior, goldens authenticate expected output, and the pinned Gate independently validates all results without importing target repository code."
reviewed_paths = [".supportability-characterization.json", ".supportability-review.toml", "docs/product_completion_contract.md", "tests/characterization/gate8-standard-results-boundary-v3.characterization.py", "tests/characterization/gate8-standard-results-boundary-v3.golden.json", "tests/characterization/s05-meaningful-behavior.characterization.py", "tests/characterization/s05-meaningful-behavior.golden.json", "tests/test_characterization.py"]

[responsibility_boundary]
path = ".supportability-characterization.json"
owns = "The active scenario, stable obligation, selector, target, and exact transition inventory consumed by protected characterization."
does_not_own = "Gate implementation, target execution, semantic review, commands, thresholds, waivers, ruleset administration, or successor remediation."

[incremental_refactor]
target = "Activate the protected meaningful-behavior contract without changing Gate commands, thresholds, or policy architecture."
completed_step = "Migrated the live characterization inventory to schema v2, added stable obligations and an exact retained migration, and activated the dedicated S05 proof driver and golden."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Scenario, obligation, selector, target, transition, baseline digest, and meaningful case names expose every deterministic input."
cohesion = "The manifest owns declarations, drivers own bounded evidence generation, goldens own expected output, and the already protected Gate owns validation."
intended_behavior = "A stable responsibility cannot disappear behind a renamed scenario, constant output, missing runtime execution, unbound capture, or nondeterministic evidence."
reviewability = "The activated manifest and two focused driver/golden pairs expose exact obligations, migration identity, positive behavior, policy blocks, and technical-failure cases."
