schema_version = "1.0"
module_boundaries = [
  { path = "src/supportability_gate/characterization.py", owner_path = "src/supportability_gate/characterization.py", basis = "responsibility", justification = "Owns stable behavioral obligations, explicit baseline migrations, capture comparison, and authenticated characterization coverage." },
  { path = "src/supportability_gate/quality_profile.py", owner_path = "src/supportability_gate/quality_profile.py", basis = "responsibility", justification = "Owns fixed quality evidence parsing and proof that required responsibility bodies executed." },
  { path = "src/supportability_gate/refactor_policy.py", owner_path = "src/supportability_gate/refactor_policy.py", basis = "responsibility", justification = "Owns strict runnability consumption of authenticated characterization results across the v1-to-v2 transition." },
  { path = "src/supportability_gate/standard_results.py", owner_path = "src/supportability_gate/standard_results.py", basis = "responsibility", justification = "Owns independent reconstruction of characterization evidence against authenticated responsibility targets." },
]

[behavior]
intended_behavior = "A required behavior cannot disappear behind a renamed scenario, constant output, import-only coverage, or an unbound result. Stable obligations retain exact baseline assertions unless an explicit digest-bound migration is declared; changed responsibility bodies must execute under the fixed quality command."
proof = "Retained RED regressions cover constant-output substitution, obligation removal, scenario rename, incorrect migration digest, import-only Python execution, incomplete Python data, malformed LCOV, targeted Python bodies, one-line bodies, and exact Standard-result recomposition."

[characterization]
captured_behavior = "Before S05, a scenario could retain a matching golden while no longer proving meaningful input-to-output behavior, and importing a file could count as runtime proof even when its changed responsibility body never executed."
proof = "Focused repository fixtures record multiple distinct inputs and outputs, stable scenario-independent obligation IDs, exact transition digests, constant-output rejection, and body-level runtime proof; live manifest activation follows only after this compatibility layer is protected and deployed."

[separation_of_concerns]
before = "Scenario identity, golden equality, coarse file coverage, and module-import execution were treated as sufficient proxies for retained behavior."
after = "Characterization owns stable obligations and migrations, quality_profile owns required-body execution proof, and standard_results binds both to independently derived responsibility targets."
