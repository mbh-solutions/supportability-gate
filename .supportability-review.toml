schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "A package-lock link row derives its locked identity only from the lock graph, while an installed link is independently required to resolve to the exact repository-contained lock target."
proof = "Focused receipt tests distinguish an absent optional link from an installed copy, the full suite passes, and GitHub-hosted Source Validation exercises npm's real file-link installation."

[characterization]
captured_behavior = "The follow-up does not change characterization capture or compatibility behavior."
proof = "The protected base and head characterization jobs pass against the same controlled scenarios."

[separation_of_concerns]
before = "The interim file-link correction derived part of a locked receipt from a checked-out package manifest and accepted a copied directory when its tree hash matched the declared link source."
after = "The lock receipt uses only package-lock rows, and installed link evidence separately proves exact path resolution to the contained lock target."
boundaries = []

[architecture]
dependency_direction = "The hosted quality-profile verifier consumes the lock graph first and then checks installed filesystem identity; the focused tests exercise that one-way evidence flow."
reviewed_paths = [
  ".supportability-review.toml",
  "tests/hosted_quality_profile.py",
  "tests/test_standard_results.py",
]

[responsibility_boundary]
path = "tests/hosted_quality_profile.py"
owns = "Hosted verification of lock-derived and installed npm dependency identities, including contained file-link targets."
does_not_own = "npm installation, consumer dependency selection, characterization policy, review prose, or organization ruleset configuration."

[incremental_refactor]
target = "S08 npm file-link provenance correction."
completed_step = "Removed repository-file fallback from locked identity and replaced content-equivalence acceptance with exact installed-link target proof."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Lock source, installed link, safe location, and copy describe the measured npm identities directly."
cohesion = "Lock graph derivation and installed-tree validation remain separate steps in the hosted quality-profile verifier."
intended_behavior = "A valid npm file link passes, an absent proven-optional link remains allowed, and a copied look-alike directory fails closed."
reviewability = "The follow-up changes one verifier boundary and pairs its positive and adversarial cases in focused receipt tests."
