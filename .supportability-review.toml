schema_version = "1.0"
module_boundaries = []

[behavior]
intended_behavior = "The focused-review observer preserves already seen serial acknowledgements across a transient GitHub HTTP 5xx response within its existing bounded poll window, while nontransient evidence failures remain fail-closed. The protected ledger records S11 as the terminal authorized slice with no successor and keeps completion prospective until every issue #154 proof and final protected merge readback exists."
proof = "tests/test_codex_review.py::test_focused_observer_retries_transient_github_failure_without_losing_acknowledgement; docs/product_completion_contract.md; issue #154"

[characterization]
captured_behavior = "Before this correction, any GitHub evidence HTTP failure terminated the focused observer immediately and discarded its in-memory acknowledgement set; the regression injects one HTTP 502 after Focus 1 acknowledgement and proves the same bounded observer completes all eight without repeating Focus 1."
proof = "tests/test_codex_review.py::test_focused_observer_retries_transient_github_failure_without_losing_acknowledgement"

[separation_of_concerns]
before = "The focused observer treated a transient GitHub server response like a permanent evidence failure, terminating the only process that retained already observed request acknowledgements."
after = "One predicate classifies only HTTP 5xx causes as transient; the existing focused observer loop alone owns bounded retry and preserves its acknowledgement set, while all other evidence failures retain immediate fail-closed behavior."
boundaries = [
    { path = "src/supportability_gate/codex_review.py", kind = "function", symbol = "_transient_github_failure", before = "No narrow classification distinguished transient GitHub server responses from permanent evidence failures.", after = "The predicate accepts only HTTPError causes with status 500 through 599." },
    { path = "src/supportability_gate/codex_review.py", kind = "function", symbol = "require_focused_acknowledgements", before = "Every GitHub evidence failure terminated the observer immediately and lost prior in-memory acknowledgements.", after = "Only transient HTTP 5xx failures consume another existing bounded poll attempt; every other evidence failure still raises immediately." },
]

[architecture]
dependency_direction = "The existing observer continues to depend only on stdlib HTTP errors and its current GitHub evidence readers. No production module, workflow, package, target command, or target execution boundary was added."
reviewed_paths = [
    ".supportability-review.toml",
    "docs/product_completion_contract.md",
    "src/supportability_gate/codex_review.py",
    "tests/test_codex_review.py",
]

[responsibility_boundary]
path = "src/supportability_gate/codex_review.py"
owns = "Trusted focused-review request, acknowledgement, completion, and bounded GitHub evidence observation for one exact pull-request head and workflow run."
does_not_own = "Connector judgment, deterministic gate results, arbitrary retry policy, target execution, ruleset activation, waivers, or product-status proof."

[incremental_refactor]
target = "Correct only the observed transient-5xx failure in the existing focused acknowledgement loop and record the terminal S11 transaction."
completed_step = "Added one narrow predicate, one conditional, and one regression; retained the existing poll count, delay, transport, evidence validation, and fail-closed behavior; updated only the existing manifest and ledger beside that correction."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "_transient_github_failure states the exact classification; require_focused_acknowledgements retains ownership of bounded observation."
cohesion = "HTTP cause classification and focused polling remain in the existing Codex review evidence module; the regression remains in its direct suite; product status remains in the ledger."
intended_behavior = "A temporary GitHub 5xx cannot erase already observed focus acknowledgements, but authentication, malformed, unavailable, timeout, and trust failures remain fail-closed."
reviewability = "The executable change is one predicate and one conditional with one direct regression; no package, workflow, command, abstraction layer, or target code changed."
