[architecture]
dependency_direction = "Characterization depends on a lower-level baseline evidence validator, which depends only on fixed source parsing and contract definitions. Target code remains confined to hosted observers."
reviewed_paths = ["src/supportability_gate/baseline_evidence.py", "src/supportability_gate/characterization.py"]

[responsibility_boundary]
path = "src/supportability_gate/baseline_evidence.py"
owns = "Static validation of first-baseline source identity, actual body execution witnesses and complete asset snapshot inventories."
does_not_own = "Target execution, semantic correctness, arbitrary runtime commands, quality thresholds, owner authentication or deployment."

[incremental_refactor]
target = "Add bounded first-application baseline evidence without excluding new code or content."
completed_step = "Integrate grouped schema-5 baselines with fixed Python/V8 observers and the existing oracle-first authorization transaction."

[review_handoff]
summary = "DERIVED_FROM_AUTHENTICATED_EVIDENCE"
remaining_risks = ["DERIVED_FROM_AUTHENTICATED_EVIDENCE"]

[human_review]
naming = "Names identify baseline inventories, absence, observed execution and fixed source identities."
cohesion = "One existing package owns behavior evidence; the new lower-level module is dedicated to validating source and asset witnesses."
intended_behavior = "Witnesses prove body execution and source identity; author-selected output cases and asset bytes do not certify semantic correctness or exhaustive behavior. No existing-production bootstrap or suppression of coverage is admitted."
reviewability = "Frozen correction evidence, real-runtime positive and negative tests, retained old-profile behavior and exact protected final-head checks."
