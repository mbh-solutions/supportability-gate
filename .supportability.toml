schema_version = "1.0"
language = "python"
production_paths = ["src"]
high_risk_paths = [
    "src/supportability_gate/cli.py",
    "src/supportability_gate/complexity_metrics.py",
    "src/supportability_gate/contract.py",
    "src/supportability_gate/git_changes.py",
]

[[gates]]
adapter = "python.c901-touched.v1"
paths = ["src"]

[[gates]]
adapter = "python.import-linter.v1"
paths = ["src"]

[[gates]]
adapter = "python.mypy-strict.v1"
paths = ["src"]

[[gates]]
adapter = "python.pytest.v1"
paths = ["src"]

[[gates]]
adapter = "python.ruff-lint.v1"
paths = ["src"]

[complexity]
adapter = "python.c901-touched.v1"
maximum = 10
